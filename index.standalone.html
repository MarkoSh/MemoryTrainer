      cardEl.className = 'min-w-[52px] h-14 sm:h-16 px-2 rounded-md border border-slate-700 bg-slate-800 flex items-center justify-center text-slate-600 font-bold';
      cardEl.textContent = '?';
    } else {
      const tint = variant === 'revealed' ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-indigo-500/40 bg-indigo-500/10';
      cardEl.className = `flex flex-col items-center justify-center gap-0.5 px-3 py-1.5 min-h-14 sm:min-h-16 rounded-md border ${tint}`;
      cardEl.innerHTML = '';
      cardEl.appendChild(Utils.el('span', { class: `${token.thai ? 'thai' : ''} font-bold text-sm sm:text-base text-slate-100 whitespace-nowrap` }, token.main));
      cardEl.appendChild(Utils.el('span', { class: 'text-[9px] text-slate-500 whitespace-nowrap' }, token.sub));
    }
    // принудительный reflow, чтобы pop-in анимация перезапускалась при каждом вызове,
    // а не оставалась "уже применённой" с точки зрения браузера
    void cardEl.offsetWidth;
    cardEl.classList.add('pop-in');
  }

  function keyboardButton(token, onClick) {
    const btn = Utils.el('button', {
      class: 'flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-md border border-slate-700 bg-slate-800 hover:border-indigo-400 active:scale-95 transition',
      onclick: onClick,
    }, [
      Utils.el('span', { class: `${token.thai ? 'thai' : ''} font-bold text-sm text-slate-100 whitespace-nowrap` }, token.main),
      Utils.el('span', { class: 'text-[8px] text-slate-500 whitespace-nowrap' }, token.sub),
    ]);
    btn.dataset.id = token.id;
    return btn;
  }

  function mount(root, onExit) {
    let langKey = 'en';
    let roundType = 'forward';
    let length = 4;

    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'mb-5' }, [
        Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('words.language')),
        Utils.el('div', { class: 'grid grid-cols-1 gap-2' }, Object.entries(LEVELS).map(([key, lv]) =>
          Utils.el('button', {
            class: `p-3 rounded-md border text-left transition ${langKey === key ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 bg-slate-800/50'}`,
            onclick: () => { langKey = key; renderSetup(); },
          }, [Utils.el('div', { class: 'font-semibold text-slate-100' }, I18N.t(lv.nameKey)), Utils.el('div', { class: 'text-xs text-slate-500' }, I18N.t('words.wordsInSet', { n: lv.pool.length }))])
        )),
      ]));
      root.appendChild(Utils.el('div', { class: 'mb-5' }, [
        Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('words.wordCount')),
        Utils.el('div', { class: 'grid grid-cols-3 gap-2' }, LENGTHS.map(n =>
          Utils.el('button', {
            class: `py-2 rounded-md border font-bold transition ${length === n ? 'border-indigo-500 bg-indigo-500/10 text-slate-100' : 'border-slate-700 bg-slate-800/50 text-slate-300'}`,
            onclick: () => { length = n; renderSetup(); },
          }, String(n))
        )),
      ]));
      root.appendChild(Utils.el('div', { class: 'mb-6' }, [
        Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('words.roundType')),
        Utils.el('div', { class: 'grid grid-cols-1 gap-2' }, Object.entries(ROUND_TYPES).map(([key, rt]) =>
          Utils.el('button', {
            class: `p-3 rounded-md border text-left transition ${roundType === key ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 bg-slate-800/50'}`,
            onclick: () => { roundType = key; renderSetup(); },
          }, [Utils.el('div', { class: 'font-semibold text-slate-100' }, I18N.t(rt.nameKey)), Utils.el('div', { class: 'text-xs text-slate-500' }, I18N.t(rt.descKey))])
        )),
      ]));
      root.appendChild(Utils.buildVoiceToggle(renderSetup));
      root.appendChild(Utils.el('button', {
        class: 'w-full py-3 rounded-md bg-indigo-500 text-white font-bold hover:bg-indigo-400 active:scale-[.98] transition',
        onclick: () => startGame(langKey, roundType, length),
      }, I18N.t('words.start')));
      Utils.refreshIcons();
    }

    function startGame(langKey, roundType, length) {
      const state = {
        langKey, roundType,
        pool: LEVELS[langKey].pool,
        length,
        score: 0,
        lives: 3,
        hints: 3,
        round: 1,
      };
      playRound(state);
    }

    function scoreKey(langKey, roundType) { return `words_${langKey}_${roundType}`; }

    function playRound(state) {
      const sequence = Utils.sample(state.pool, state.length);
      const phases = phasesFor(state.roundType);
      playPhase(state, sequence, phases, 0, true);
    }

    function playPhase(state, sequence, phases, phaseIdx, doStudy) {
      const phaseType = phases[phaseIdx];
      const noiseCount = Math.min(state.pool.length - state.length, 4 + Math.floor(state.length / 2));
      const noise = Utils.sample(state.pool.filter(t => !sequence.includes(t)), Math.max(0, noiseCount));
      const keyboardTokens = Utils.shuffle([...sequence, ...noise]);

      let askOrder;
      if (phaseType === 'forward') askOrder = sequence.map((_, i) => i);
      else if (phaseType === 'reverse') askOrder = sequence.map((_, i) => i).reverse();
      else askOrder = [Utils.randInt(0, sequence.length - 1)];

      let askPtr = 0;
      const studyTime = 1400 + state.length * 1300;

      root.innerHTML = '';
      root.appendChild(header());

      const isCombo = phases.length > 1;
      const info = Utils.el('div', { class: 'text-center text-sm text-slate-400 mb-3' },
        isCombo ? I18N.t('words.phase', { i: phaseIdx + 1, n: phases.length, name: I18N.t(ROUND_TYPES[phaseType].nameKey) }) : I18N.t(ROUND_TYPES[phaseType].descKey));
      root.appendChild(info);

      const barOuter = Utils.el('div', { class: 'w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4' });
      const barInner = Utils.el('div', { class: 'h-full bg-indigo-500', style: 'width:100%;transition:width linear' });
      barOuter.appendChild(barInner);
      if (!doStudy) barOuter.classList.add('invisible');
      root.appendChild(barOuter);

      const cardsRow = Utils.el('div', { class: 'flex flex-wrap justify-center gap-2 mb-6' });
      const cardEls = sequence.map((tok, i) => {
        const card = Utils.el('div', { 'data-i': i });
        renderCard(card, tok, doStudy ? 'study' : 'hidden');
        card.addEventListener('click', () => { if (card.dataset.variant !== 'hidden') maybeSpeak(tok); });
        cardsRow.appendChild(card);
        return card;
      });
      root.appendChild(cardsRow);

      const keyboardWrap = Utils.el('div', { class: 'flex flex-wrap gap-2 justify-center' });
      root.appendChild(keyboardWrap);
      Utils.refreshIcons();

      if (doStudy) {
        Utils.startBarDrain(barInner, studyTime);
        const studyTimeout = setTimeout(() => {
          cardEls.forEach(c => renderCard(c, null, 'hidden'));
          setTimeout(() => showKeyboard(), 200);
        }, studyTime);
        state._studyTimeout = studyTimeout;
      } else {
        showKeyboard();
      }

      function showKeyboard() {
        highlightTarget();
        keyboardTokens.forEach(tok => keyboardWrap.appendChild(keyboardButton(tok, (e) => { maybeSpeak(tok); handleGuess(tok, e.currentTarget); })));
        Utils.refreshIcons();
      }

      function highlightTarget() {
        cardEls.forEach(c => c.classList.remove('ring-2', 'ring-amber-400'));
        if (askPtr < askOrder.length) {
          cardEls[askOrder[askPtr]].classList.add('ring-2', 'ring-amber-400');
        }
      }

      function handleGuess(tok, btn) {
        if (askPtr >= askOrder.length) return;
        const targetIdx = askOrder[askPtr];
        const correct = sequence[targetIdx].id === tok.id;
        if (correct) {
          renderCard(cardEls[targetIdx], sequence[targetIdx], 'revealed');
          state.score += 10 + state.length;
          askPtr++;
          highlightTarget();
          updateHud();
          if (askPtr >= askOrder.length) advancePhase();
        } else {
          state.lives--;
          btn.classList.add('shake');
          setTimeout(() => btn.classList.remove('shake'), 500);
          state.score = Math.max(0, state.score - 5);
          updateHud();
          if (state.lives <= 0) gameOver(state);
        }
      }

      function advancePhase() {
        clearTimeout(state._studyTimeout);
        setTimeout(() => {
          if (phaseIdx + 1 < phases.length) {
            playPhase(state, sequence, phases, phaseIdx + 1, false);
          } else {
            state.round++;
            playRound(state);
          }
        }, 900);
      }

      function useHint() {
        if (state.hints <= 0 || askPtr >= askOrder.length) return;
        state.hints--;
        state.score = Math.max(0, state.score - 15);
        const targetIdx = askOrder[askPtr];
        renderCard(cardEls[targetIdx], sequence[targetIdx], 'revealed');
        askPtr++;
        highlightTarget();
        updateHud();
        if (askPtr >= askOrder.length) advancePhase();
      }

      function header() {
        const hud = Utils.el('div', { class: 'flex items-center justify-between mb-4' }, [
          Utils.el('div', { class: 'text-sm font-semibold text-slate-400' }, I18N.t('words.round', { n: state.round })),
          Utils.el('div', { id: 'words-hearts', class: 'flex items-center gap-1' }),
          Utils.el('button', { id: 'words-hint-btn', class: 'flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-amber-500/15 text-amber-400', onclick: () => useHint() }, [
            Utils.el('i', { 'data-lucide': 'lightbulb', class: 'w-4 h-4' }),
            Utils.el('span', { id: 'words-hint-count' }, String(state.hints)),
          ]),
          Utils.el('span', { id: 'words-score', class: 'text-sm font-bold text-indigo-400' }, I18N.t('common.points', { n: state.score })),
        ]);
        setTimeout(updateHud, 0);
        return hud;
      }

      function updateHud() {
        const hearts = root.querySelector('#words-hearts');
        if (hearts) {
          hearts.innerHTML = '';
          for (let i = 0; i < 3; i++) {
            hearts.appendChild(Utils.el('i', { 'data-lucide': 'heart', class: `w-4 h-4 ${i < state.lives ? 'text-rose-500 fill-rose-500' : 'text-slate-700 fill-slate-700'}` }));
          }
        }
        const hintCount = root.querySelector('#words-hint-count');
        if (hintCount) hintCount.textContent = String(state.hints);
        const scoreEl = root.querySelector('#words-score');
        if (scoreEl) scoreEl.textContent = I18N.t('common.points', { n: state.score });
        Utils.refreshIcons();
      }
    }

    function gameOver(state) {
      const key = scoreKey(state.langKey, state.roundType);
      const isBest = Utils.setBest(key, state.score, true);
      Utils.recordResult(key, state.score);
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': 'flag', class: 'w-10 h-10 mx-auto text-slate-500 mb-3' }),
        Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t('words.gameOver')),
        Utils.el('div', { class: 'text-slate-400 mt-1' }, I18N.t('words.scoreLine', { score: state.score }) + (isBest ? I18N.t('common.newRecord') : '')),
        Utils.el('div', { class: 'flex gap-2 justify-center mt-6' }, [
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-indigo-500 text-white font-semibold hover:bg-indigo-400', onclick: () => startGame(state.langKey, state.roundType, state.length) }, I18N.t('common.playAgain')),
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: onExit }, I18N.t('common.toMenu')),
        ]),
      ]));
      Utils.refreshIcons();
    }
  }

  return { id: 'words', titleKey: 'game.words.title', descKey: 'game.words.desc', icon: 'languages', color: 'bg-cyan-500', historyVariants, mount };
})();
</script>
  <script>
// Тренажёр "Эдуба: слова" — тематические блоки, как в лексических списках шумерских писцов:
// сначала всё близкое и конкретное (тело, семья, животные), в конце — действия.
// Каждый блок сдаётся целиком (см. edubba.js), прежде чем откроется следующий.
// Слово: [английский, тайский, транскрипция тайского (RTGS-подобная, долгие a/i/u удвоены)].
const GameEdubba = (() => {
  const CATEGORIES = [
    { id: 'body', words: [['head', 'หัว', 'hua'], ['hair', 'ผม', 'phom'], ['face', 'หน้า', 'naa'], ['eye', 'ตา', 'taa'],
      ['ear', 'หู', 'huu'], ['nose', 'จมูก', 'chamuuk'], ['mouth', 'ปาก', 'paak'], ['hand', 'มือ', 'mue']] },
    { id: 'family', words: [['mother', 'แม่', 'mae'], ['father', 'พ่อ', 'pho'], ['son', 'ลูกชาย', 'luuk chaai'], ['daughter', 'ลูกสาว', 'luuk saao'],
      ['friend', 'เพื่อน', 'phuean'], ['family', 'ครอบครัว', 'khrop khrua'], ['man', 'ผู้ชาย', 'phuu chaai'], ['woman', 'ผู้หญิง', 'phuu ying']] },
    { id: 'animals', words: [['dog', 'หมา', 'maa'], ['cat', 'แมว', 'maeo'], ['bird', 'นก', 'nok'], ['fish', 'ปลา', 'plaa'],
      ['cow', 'วัว', 'wua'], ['pig', 'หมู', 'muu'], ['elephant', 'ช้าง', 'chaang'], ['chicken', 'ไก่', 'kai']] },
    { id: 'food', words: [['water', 'น้ำ', 'naam'], ['rice', 'ข้าว', 'khaao'], ['egg', 'ไข่', 'khai'], ['milk', 'นม', 'nom'],
      ['tea', 'ชา', 'chaa'], ['coffee', 'กาแฟ', 'kaa fae'], ['salt', 'เกลือ', 'kluea'], ['fruit', 'ผลไม้', 'phon la mai']] },
    { id: 'numbers', words: [['one', 'หนึ่ง', 'nueng'], ['two', 'สอง', 'song'], ['three', 'สาม', 'saam'], ['four', 'สี่', 'sii'], ['five', 'ห้า', 'haa'],
      ['six', 'หก', 'hok'], ['seven', 'เจ็ด', 'chet'], ['eight', 'แปด', 'paet'], ['nine', 'เก้า', 'kao'], ['ten', 'สิบ', 'sip']] },
    { id: 'time', words: [['day', 'วัน', 'wan'], ['night', 'คืน', 'khuen'], ['morning', 'เช้า', 'chaao'], ['evening', 'เย็น', 'yen'],
      ['week', 'สัปดาห์', 'sap daa'], ['month', 'เดือน', 'duean'], ['year', 'ปี', 'pii'], ['yesterday', 'เมื่อวาน', 'muea waan']] },
    { id: 'nature', words: [['sky', 'ฟ้า', 'faa'], ['rain', 'ฝน', 'fon'], ['wind', 'ลม', 'lom'], ['fire', 'ไฟ', 'fai'],
      ['tree', 'ต้นไม้', 'ton mai'], ['flower', 'ดอกไม้', 'dok mai'], ['river', 'แม่น้ำ', 'mae naam'], ['sea', 'ทะเล', 'tha le']] },
    { id: 'home', words: [['house', 'บ้าน', 'baan'], ['door', 'ประตู', 'pra tuu'], ['window', 'หน้าต่าง', 'naa tang'], ['table', 'โต๊ะ', 'to'],
      ['chair', 'เก้าอี้', 'kao ii'], ['bed', 'เตียง', 'tiang'], ['book', 'หนังสือ', 'nang sue'], ['key', 'กุญแจ', 'kun chae']] },
    { id: 'people', words: [['scribe', 'เสมียน', 'sa mian'], ['teacher', 'ครู', 'khruu'], ['student', 'นักเรียน', 'nak rian'], ['doctor', 'หมอ', 'mo'],
      ['farmer', 'ชาวนา', 'chaao naa'], ['cook', 'พ่อครัว', 'pho khrua'], ['police', 'ตำรวจ', 'tam ruat'], ['king', 'กษัตริย์', 'ka sat']] },
    { id: 'actions', words: [['eat', 'กิน', 'kin'], ['drink', 'ดื่ม', 'duem'], ['go', 'ไป', 'pai'], ['come', 'มา', 'maa'],
      ['sleep', 'นอน', 'non'], ['read', 'อ่าน', 'aan'], ['write', 'เขียน', 'khian'], ['speak', 'พูด', 'phuut']] },
  ];

  // режимы независимы: слова двух языков в одной сессии не смешиваются
  const MODES = {
    en: { nameKey: 'edubba.modeEn', thai: false, lang: 'en-US', main: w => w[0], sub: w => `${w[1]} · ${w[2]}` },
    th: { nameKey: 'edubba.modeTh', thai: true, lang: 'th-TH', main: w => w[1], sub: w => `${w[2]} · ${w[0]}` },
  };

  // лишние плитки-"помехи" по фазам: копирование почти без них, проверка — с запасом
  const EXTRA_TILES = { copy: 2, recall: 4, exam: 6 };
  // кластер = буква + её надстрочные/подстрочные знаки (тайские гласные и тоны), чтобы плитка была читаемой
  const CLUSTER = /\P{M}\p{M}*/gu;

  function makeItem(mode, w) {
    const m = MODES[mode];
    return { id: mode + '_' + w[0], answer: m.main(w), main: m.main(w), sub: m.sub(w), thai: m.thai };
  }

  function modelNode(item) {
    return Utils.el('div', { class: 'pop-in text-center p-4 rounded-md border border-indigo-500/40 bg-indigo-500/10' }, [
      Utils.el('div', { class: `${item.thai ? 'thai' : ''} text-3xl font-extrabold text-slate-100` }, item.main),
      Utils.el('div', { class: 'thai text-sm text-slate-400 mt-1' }, item.sub),
    ]);
  }

  function promptNode(item) {
    return Utils.el('div', { class: 'text-center p-4 rounded-md border border-slate-700 bg-slate-800/50' }, [
      Utils.el('div', { class: 'thai text-xl font-bold text-slate-100' }, item.sub),
      Utils.el('div', { class: 'text-2xl text-slate-600 mt-1' }, '?'),
    ]);
  }

  // слово собирается из плиток: и для латиницы, и для тайского работает без экранной клавиатуры
  function tilesInput(answer, extra, pool, submit, thai) {
    const chars = answer.match(CLUSTER);
    const tiles = Utils.shuffle([...chars, ...Utils.sample(pool.filter(c => !chars.includes(c)), extra)]);
    let picked = [];
    const line = Utils.el('div', { class: `${thai ? 'thai' : ''} min-h-[3.5rem] flex flex-wrap items-center justify-center gap-1 rounded-md border border-slate-700 bg-slate-900 p-2 mb-3 text-2xl font-bold text-slate-100` });
    const bank = Utils.el('div', { class: 'flex flex-wrap justify-center gap-2' });
    const node = Utils.el('div', {}, [line, bank]);

    function draw() {
      line.innerHTML = '';
      picked.forEach(i => line.appendChild(Utils.el('span', {}, tiles[i])));
      bank.innerHTML = '';
      tiles.forEach((t, i) => bank.appendChild(Utils.el('button', {
        class: `${thai ? 'thai' : ''} min-w-[44px] h-12 px-3 rounded-md border border-slate-700 bg-slate-800 text-xl font-bold text-slate-100 hover:border-indigo-400 active:scale-95 transition ${picked.includes(i) ? 'opacity-25' : ''}`,
        disabled: picked.includes(i) ? '' : null,
        onclick: () => {
          picked.push(i);
          draw();
          if (picked.length === chars.length) submit(picked.map(j => tiles[j]).join(''));
        },
      }, t)));
      bank.appendChild(Utils.el('button', {
        class: 'min-w-[44px] h-12 px-3 rounded-md border border-slate-700 bg-slate-900 text-slate-400 hover:border-indigo-400',
        onclick: () => { picked.pop(); draw(); },
      }, '⌫'));
    }
    node.reset = () => { picked = []; draw(); };
    draw();
    return node;
  }

  function mount(root) {
    let mode = 'en';
    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'grid grid-cols-2 gap-2 mb-5' }, Object.entries(MODES).map(([key, m]) =>
        Utils.el('button', {
          class: `p-3 rounded-md border font-semibold transition ${mode === key ? 'border-indigo-500 bg-indigo-500/10 text-slate-100' : 'border-slate-700 bg-slate-800/50 text-slate-300'}`,
          onclick: () => { mode = key; renderSetup(); },
        }, I18N.t(m.nameKey)))));
      root.appendChild(Edubba.renderLessons(CATEGORIES.map(c => ({
        id: `words_${mode}_${c.id}`,
        cat: c,
        title: I18N.t('edubba.cat.' + c.id),
        sub: I18N.t('edubba.wordsN', { n: c.words.length }),
      })), l => startLesson(l.cat)));
      root.appendChild(Utils.el('div', { class: 'mt-5' }, Utils.buildVoiceToggle(renderSetup)));
      Utils.refreshIcons();
    }

    function startLesson(cat) {
      const m = MODES[mode];
      const items = cat.words.map(w => makeItem(mode, w));
      const pool = [...new Set(items.flatMap(it => it.answer.match(CLUSTER)))];
      Edubba.run(root, {
        id: `words_${mode}_${cat.id}`,
        title: `${I18N.t(m.nameKey)} · ${I18N.t('edubba.cat.' + cat.id)}`,
        items,
        prompt: promptNode,
        model: modelNode,
        makeInput: (item, phase, submit) => tilesInput(item.answer, EXTRA_TILES[phase], pool, submit, m.thai),
        isCorrect: (item, value) => value === item.answer,
        speak: it => { if (Utils.getVoiceEnabled()) Utils.speak(it.main, m.lang); },
        onExit: renderSetup,
      });
    }
  }

  return { id: 'edubba', titleKey: 'game.edubba.title', descKey: 'game.edubba.desc', icon: 'scroll-text', color: 'bg-orange-600', mount };
})();
</script>
  <script>
// Тренажёр "Математика, шумерская" — шестидесятеричная система в логике писцов эдубы:
// не считать каждый пример заново, а заучить таблицы обратных чисел (igi) и таблицы
// умножения, а потом собирать составные вычисления только из заученного.
// Деление на n = умножение на igi n. Все числа — позиционные, места через ":" (1:06 = «1, 6»),
// в десятичный вид результат нигде не переводится: внутри код считает целыми, но игроку
// показывается и от него принимается только шестидесятеричная запись.
const GameSumer = (() => {
  // --- шестидесятеричная арифметика ---
  function fmt(n) {
    if (n === 0) return '0';
    const places = [];
    for (; n > 0; n = Math.floor(n / 60)) places.unshift(n % 60);
    return places.map((p, i) => (i ? String(p).padStart(2, '0') : String(p))).join(':');
  }

  // нормальная форма для сравнения: как в клинописи, конечные нули не пишутся ("1:00" = "1"),
  // а значение места — 0..59; всё остальное (не число, место > 59) — null
  function canon(s) {
    const parts = String(s).trim().split(':');
    if (!parts.every(p => /^\d{1,2}$/.test(p) && Number(p) < 60)) return null;
    const nums = parts.map(Number);
    while (nums.length > 1 && nums[nums.length - 1] === 0) nums.pop();
    while (nums.length > 1 && nums[0] === 0) nums.shift();
    return nums.join(':');
  }

  // igi n: число, на которое умножают n, чтобы получить 1 (степень 60); только для n = 2^a·3^b·5^c
  function rec(n) {
    for (let k = 1, p = 60; k <= 6; k++, p *= 60) if (p % n === 0) return p / n;
    return null;
  }

  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

  // --- программа: обратные числа и таблицы умножения (порядок = порядок освоения) ---
  // сначала igi 2–15, потом таблицы тех самых обратных (30, 20, 15, 12, 10…): делить на n —
  // значит умножать на igi n, поэтому таблица igi n нужна ровно для деления на n
  // 7, 11, 13, 14… пропущены: у них нет конечного igi (несократимые «нерегулярные» числа)
  const IGI = [[2, 3, 4, 5, 6, 8, 9, 10, 12, 15], [16, 18, 20, 24, 25, 27, 30], [32, 36, 40, 45, 48, 50, 54]];
  const igi = i => ({ id: `sumer_igi${i + 1}`, kind: 'igi', ns: IGI[i] });
  const mul = (base, part) => ({
    id: `sumer_mul${base}${part}`, kind: 'mul', base, part,
    nums: part === 'a' ? range(1, 10) : [...range(11, 20), 30, 40, 50],
  });
  const both = base => [mul(base, 'a'), mul(base, 'b')];
  const LESSONS = [
    igi(0),
    ...[30, 20, 15, 12, 10].map(b => mul(b, 'a')),
    ...[30, 20, 15, 12, 10].map(b => mul(b, 'b')),
    ...[6, 5, 4].flatMap(both),
    igi(1),
    ...[450, 400, 3, 2].flatMap(both), // 450 = 7:30, 400 = 6:40 (igi 8 и igi 9)
    igi(2),
  ];
  const BASES = [30, 20, 15, 12, 10, 6, 5, 4, 450, 400, 3, 2];

  // до какого множителя таблица основания заучена (10 — часть A, 20 — ещё и часть B)
  const maxMul = b => (Edubba.isMastered(`sumer_mul${b}b`) ? 20 : Edubba.isMastered(`sumer_mul${b}a`) ? 10 : 0);
  const usableBases = () => BASES.filter(b => maxMul(b) >= 10);
  const usableDivisors = () => (Edubba.isMastered('sumer_igi1') ? IGI[0].filter(n => maxMul(rec(n)) >= 10) : []);

  const pick = arr => arr[Utils.randInt(0, arr.length - 1)];

  // составной пример = цепочка шагов, каждый шаг — строка из заученной таблицы либо сложение
  function makeTask(tier) {
    if (tier === 3) {
      const b = pick(usableBases()), m = maxMul(b);
      const d1 = Utils.randInt(1, m), d0 = Utils.randInt(1, m), a = d1 * 60 + d0;
      return { title: `${fmt(a)} × ${fmt(b)}`, steps: [
        { q: `${d1} × ${fmt(b)}`, answer: fmt(d1 * b) },
        { q: `${d0} × ${fmt(b)}`, answer: fmt(d0 * b) },
        { q: `${fmt(d1 * b)}:00 + ${fmt(d0 * b)}`, answer: fmt(a * b) },
      ] };
    }
    const n = pick(usableDivisors()), r = rec(n), m = maxMul(r);
    if (tier === 1) {
      const d = Utils.randInt(2, m);
      return { title: `${d} ÷ ${n}`, steps: [
        { q: `igi ${n}`, answer: fmt(r) },
        { q: `${d} × ${fmt(r)}`, answer: fmt(d * r) },
      ] };
    }
    const d1 = Utils.randInt(1, m), d0 = Utils.randInt(1, m), a = d1 * 60 + d0;
    return { title: `${fmt(a)} ÷ ${n}`, steps: [
      { q: `igi ${n}`, answer: fmt(r) },
      { q: `${d1} × ${fmt(r)}`, answer: fmt(d1 * r) },
      { q: `${d0} × ${fmt(r)}`, answer: fmt(d0 * r) },
      { q: `${fmt(d1 * r)}:00 + ${fmt(d0 * r)}`, answer: fmt(a * r) },
    ] };
  }

  const TIERS = [1, 2, 3];
  const tierReady = t => (t === 3 ? usableBases().length > 0 : usableDivisors().length > 0);
  const practiceKey = t => `sumer_practice_t${t}`;

  function historyVariants() {
    return TIERS.map(t => ({ key: practiceKey(t), label: I18N.t('sumer.tier' + t) }));
  }

  // экранная клавиатура: цифры и ":" для разделения мест — системная клавиатура двоеточия не даёт
  function keypad(submit) {
    let val = '';
    const display = Utils.el('div', { class: 'h-14 flex items-center justify-center rounded-md border border-slate-700 bg-slate-900 text-3xl font-extrabold tracking-wider text-slate-100 mb-3' });
    const draw = () => { display.textContent = val || '·'; };
    const key = (label, onclick) => Utils.el('button', { class: 'py-3 rounded-md border border-slate-700 bg-slate-800 text-xl font-bold text-slate-100 hover:border-indigo-400 active:scale-95 transition', onclick }, label);
    const add = ch => () => { if (val.length < 12) { val += ch; draw(); } };
    const node = Utils.el('div', {}, [
      display,
      Utils.el('div', { class: 'grid grid-cols-3 gap-2' }, [
        ...'123456789'.split('').map(d => key(d, add(d))),
        key(':', add(':')), key('0', add('0')), key('⌫', () => { val = val.slice(0, -1); draw(); }),
      ]),
      Utils.el('button', {
        class: 'w-full mt-2 py-3 rounded-md bg-indigo-500 text-white font-bold hover:bg-indigo-400 active:scale-[.98] transition',
        onclick: () => { if (val) submit(val); },
      }, 'OK'),
    ]);
    node.reset = () => { val = ''; draw(); };
    draw();
    return node;
  }

  const eqNode = (q, a, tone) => Utils.el('div', { class: `pop-in text-center p-4 rounded-md border ${tone}` }, [
    Utils.el('span', { class: 'text-3xl font-extrabold text-slate-100' }, a == null ? `${q} = ?` : `${q} = ${a}`),
  ]);

  function lessonItems(l) {
    return l.kind === 'igi'
      ? l.ns.map(n => ({ id: 'igi' + n, q: `igi ${n}`, answer: fmt(rec(n)), hint: true }))
      : l.nums.map(k => ({ id: `${l.base}x${k}`, q: `${fmt(l.base)} × ${k}`, answer: fmt(l.base * k) }));
  }

  function lessonTitle(l) {
    return l.kind === 'igi'
      ? I18N.t('sumer.lessonIgi', { a: l.ns[0], b: l.ns[l.ns.length - 1] })
      : I18N.t('sumer.lessonMul', { p: fmt(l.base) });
  }

  // диапазон множителей — во вторую строку списка, иначе длинное название обрезается
  const rangeLabel = l => (l.kind === 'mul' ? I18N.t(l.part === 'a' ? 'sumer.rangeA' : 'sumer.rangeB') : '');
  const lessonSub = l => [rangeLabel(l), I18N.t('sumer.itemsN', { n: lessonItems(l).length })].filter(Boolean).join(' · ');

  function mount(root) {
    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('details', { class: 'mb-5 text-xs text-slate-500' }, [
        Utils.el('summary', { class: 'cursor-pointer select-none text-slate-400 hover:text-slate-300 py-1' }, I18N.t('sumer.howTitle')),
        Utils.el('div', { class: 'mt-1.5 space-y-1.5' }, ['sumer.how1', 'sumer.how2', 'sumer.how3'].map(k => Utils.el('p', {}, I18N.t(k)))),
      ]));

      root.appendChild(Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('sumer.tables')));
      root.appendChild(Edubba.renderLessons(LESSONS.map(l => ({
        id: l.id, l, title: lessonTitle(l), sub: lessonSub(l),
      })), x => startLesson(x.l)));

      root.appendChild(Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mt-6 mb-1' }, I18N.t('sumer.practice')));
      root.appendChild(Utils.el('div', { class: 'text-xs text-slate-500 mb-2' }, I18N.t('sumer.practiceNote')));
      root.appendChild(Utils.el('div', { class: 'space-y-2' }, TIERS.map(t => {
        const ready = tierReady(t), best = Utils.getBest(practiceKey(t));
        return Utils.el('button', {
          class: `w-full flex items-center justify-between p-3 rounded-md border text-left transition ${ready ? 'border-slate-700 bg-slate-800/50 hover:border-indigo-400' : 'border-slate-800 bg-slate-900/40 opacity-50'}`,
          onclick: ready ? () => runPractice(t) : null,
        }, [
          Utils.el('div', {}, [
            Utils.el('div', { class: 'font-semibold text-slate-100' }, I18N.t('sumer.tier' + t)),
            Utils.el('div', { class: 'text-xs text-slate-500' }, I18N.t('sumer.tier' + t + 'Desc')),
          ]),
          best != null ? Utils.el('span', { class: 'text-xs font-bold text-slate-400' }, I18N.t('common.record') + ': ' + best) : null,
        ]);
      })));
      Utils.refreshIcons();
    }

    function startLesson(l) {
      Edubba.run(root, {
        id: l.id,
        title: [lessonTitle(l), rangeLabel(l)].filter(Boolean).join(' · '),
        items: lessonItems(l),
        prompt: it => Utils.el('div', {}, [
          eqNode(it.q, null, 'border-slate-700 bg-slate-800/50'),
          it.hint ? Utils.el('div', { class: 'text-xs text-slate-500 text-center mt-2' }, I18N.t('sumer.igiHint')) : null,
        ]),
        model: it => eqNode(it.q, it.answer, 'border-indigo-500/40 bg-indigo-500/10'),
        makeInput: (item, phase, submit) => keypad(submit),
        isCorrect: (item, value) => canon(value) === canon(item.answer),
        onExit: renderSetup,
      });
    }

    function runPractice(tier) {
      const TASKS = 8;
      let ti = 0, score = 0;
      nextTask();

      function nextTask() {
        if (ti >= TASKS) return finish();
        const task = makeTask(tier);
        let si = 0, mistakes = 0;
        const done = [];
        renderStep();

        function frame(body) {
          root.innerHTML = '';
          root.appendChild(Utils.el('div', { class: 'flex items-center justify-between text-sm mb-3' }, [
            Utils.el('span', { class: 'font-semibold text-slate-300' }, I18N.t('sumer.taskN', { i: ti + 1, n: TASKS })),
            Utils.el('span', { class: 'font-bold text-indigo-400' }, I18N.t('common.points', { n: score })),
          ]));
          root.appendChild(Utils.el('div', { class: 'text-center text-3xl font-extrabold text-slate-100 mb-4' }, task.title));
          root.appendChild(Utils.el('div', { class: 'space-y-1 mb-4 text-center text-slate-400' }, done.map(d => Utils.el('div', {}, d))));
          body.forEach(n => root.appendChild(n));
        }

        function renderStep() {
          const step = task.steps[si];
          let tries = 0;
          const widget = keypad(value => {
            if (canon(value) === canon(step.answer)) return advance();
            mistakes++;
            tries++;
            widget.classList.add('shake');
            setTimeout(() => widget.classList.remove('shake'), 500);
            widget.reset();
            if (tries >= 3) advance();
          });
          frame([Utils.el('div', { class: 'text-center text-2xl font-bold text-indigo-300 mb-3' }, `${step.q} = ?`), widget]);

          function advance() {
            done.push(`${step.q} = ${step.answer}`);
            if (++si < task.steps.length) return renderStep();
            score += Math.max(0, 10 - 3 * mistakes);
            ti++;
            frame([]);
            setTimeout(nextTask, 700);
          }
        }
      }

      function finish() {
        Utils.setBest(practiceKey(tier), score, true);
        Utils.recordResult(practiceKey(tier), score);
        root.innerHTML = '';
        root.appendChild(Utils.el('div', { class: 'text-center py-8' }, [
          Utils.el('i', { 'data-lucide': 'flag', class: 'w-10 h-10 mx-auto text-slate-500 mb-3' }),
          Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t('sumer.practiceDone')),
          Utils.el('div', { class: 'text-slate-400 mt-1' }, I18N.t('sumer.scoreLine', { score, max: TASKS * 10 })),
          Utils.el('div', { class: 'flex gap-2 justify-center mt-6' }, [
            Utils.el('button', { class: 'px-4 py-2 rounded-md bg-indigo-500 text-white font-semibold hover:bg-indigo-400', onclick: () => runPractice(tier) }, I18N.t('common.playAgain')),
            Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: renderSetup }, I18N.t('edubba.toList')),
          ]),
        ]));
        Utils.refreshIcons();
      }
    }
  }

  return { id: 'sumer', titleKey: 'game.sumer.title', descKey: 'game.sumer.desc', icon: 'sigma', color: 'bg-teal-600', historyVariants, mount, sex: { fmt, canon, rec } };
})();
</script>
  <script>
// Тренажёр "Скорочтение" — метод Spritz (RSVP): слова показываются по одному
// в фиксированной точке экрана, с "оптимальной точкой распознавания" (ORP) —
// одна буква слова всегда выровнена по центру, чтобы глаз не двигался.
const GameSpeedRead = (() => {
  const MIN_WPM = 100, MAX_WPM = 900, STEP_WPM = 25, DEFAULT_WPM = 300;

  // эвристика ORP: чем длиннее слово, тем дальше от начала фиксируемая буква
  function pivotIndex(len) {
    if (len <= 1) return 0;
    if (len <= 5) return 1;
    if (len <= 9) return 2;
    if (len <= 13) return 3;
    return 4;
  }

  // ponytail: линейная надбавка за длину/пунктуацию — грубое приближение к
  // реальному тайминг-движку Spritz, но покрывает главный эффект (длинные
  // слова и концы предложений требуют больше времени на осмысление)
  function msForWord(word, wpm) {
    const base = 60000 / wpm;
    let ms = base;
    if (word.length > 6) ms += base * 0.04 * (word.length - 6);
    if (/[.!?]$/.test(word)) ms += base * 0.8;
    else if (/[,;:—]$/.test(word)) ms += base * 0.4;
    return ms;
  }

  function mount(root, onExit) {
    const state = { words: [], fileName: '', idx: 0, wpm: DEFAULT_WPM, playing: false, bookmark: null, timer: null };

    renderSetup();

    function renderSetup() {
      clearTimeout(state.timer);
      root.innerHTML = '';
      const input = Utils.el('input', {
        type: 'file', accept: '.txt,text/plain', class: 'hidden',
        onchange: async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const text = await file.text();
          const words = text.trim().split(/\s+/).filter(Boolean);
          if (!words.length) { alert(I18N.t('speedread.emptyFile')); return; }
          state.words = words;
          state.fileName = file.name;
          state.idx = 0;
          state.bookmark = null;
          renderReader();
        },
      });
      root.appendChild(input);
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': 'file-text', class: 'w-10 h-10 mx-auto text-slate-500 mb-3' }),
        Utils.el('div', { class: 'text-slate-400 mb-5' }, I18N.t('speedread.chooseFile')),
        Utils.el('button', {
          class: 'px-5 py-3 rounded-md bg-indigo-500 text-white font-bold hover:bg-indigo-400 active:scale-[.98] transition',
          onclick: () => input.click(),
        }, I18N.t('speedread.chooseFileBtn')),
      ]));
      Utils.refreshIcons();
    }

    function renderReader() {
      root.innerHTML = '';

      const header = Utils.el('div', { class: 'flex items-center justify-between mb-4 gap-2' }, [
        Utils.el('div', { class: 'text-sm text-slate-400 truncate' }, state.fileName),
        Utils.el('button', {
          class: 'shrink-0 flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700',
          onclick: renderSetup,
        }, [Utils.el('i', { 'data-lucide': 'file-x', class: 'w-4 h-4' }), I18N.t('speedread.changeFile')]),
      ]);

      const progressLabel = Utils.el('div', { class: 'text-center text-xs text-slate-500 mb-1' });
      const barOuter = Utils.el('div', { class: 'w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4' });
      const barInner = Utils.el('div', { class: 'h-full bg-indigo-500', style: 'width:0%' });
      barOuter.appendChild(barInner);

      const pivotEl = Utils.el('span', { class: 'spritz-pivot' });
      const leftEl = Utils.el('span', { class: 'spritz-left' });
      const rightEl = Utils.el('span', { class: 'spritz-right' });
      const stage = Utils.el('div', { class: 'spritz-stage mb-4' }, [
        Utils.el('div', { class: 'spritz-tick top' }),
        Utils.el('div', { class: 'spritz-word' }, [leftEl, pivotEl, rightEl]),
        Utils.el('div', { class: 'spritz-tick bottom' }),
      ]);

      const wpmLabel = Utils.el('span', { class: 'font-bold text-slate-100' }, String(state.wpm));
      const speedRow = Utils.el('div', { class: 'flex items-center gap-3 mb-5' }, [
        Utils.el('button', {
          class: 'w-9 h-9 shrink-0 rounded-md bg-slate-800 border border-slate-700 text-slate-200 font-bold hover:border-indigo-400',
          onclick: () => setWpm(state.wpm - STEP_WPM),
        }, '−'),
        Utils.el('div', { class: 'flex-1 text-center text-sm text-slate-400' }, [I18N.t('speedread.speedLabel') + ' ', wpmLabel, ' ' + I18N.t('speedread.wpmUnit')]),
        Utils.el('button', {
          class: 'w-9 h-9 shrink-0 rounded-md bg-slate-800 border border-slate-700 text-slate-200 font-bold hover:border-indigo-400',
          onclick: () => setWpm(state.wpm + STEP_WPM),
        }, '+'),
      ]);
      const slider = Utils.el('input', {
        type: 'range', min: MIN_WPM, max: MAX_WPM, step: STEP_WPM, value: state.wpm,
        class: 'w-full mb-6 accent-indigo-500',
        oninput: (e) => setWpm(Number(e.target.value)),
      });

      const toggleBtn = Utils.el('button', {
        class: 'w-full py-3 rounded-md bg-indigo-500 text-white font-bold hover:bg-indigo-400 active:scale-[.98] transition flex items-center justify-center gap-2',
        onclick: toggle,
      });
      const primaryRow = Utils.el('div', { class: 'mb-2' }, [toggleBtn]);

      const toStartBtn = Utils.el('button', {
        class: 'py-2.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300 text-sm font-semibold hover:border-indigo-400 flex items-center justify-center gap-1.5',
        onclick: toBeginning,
      }, [Utils.el('i', { 'data-lucide': 'rotate-ccw', class: 'w-4 h-4' }), I18N.t('speedread.toStart')]);
      const bookmarkBtn = Utils.el('button', {
        class: 'py-2.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300 text-sm font-semibold hover:border-indigo-400 flex items-center justify-center gap-1.5',
        onclick: setBookmark,
      }, [Utils.el('i', { 'data-lucide': 'bookmark', class: 'w-4 h-4' }), I18N.t('speedread.bookmark')]);
      const toBookmarkBtn = Utils.el('button', {
        class: 'py-2.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300 text-sm font-semibold hover:border-indigo-400 flex items-center justify-center gap-1.5 disabled:opacity-40',
        onclick: goToBookmark,
      }, [Utils.el('i', { 'data-lucide': 'bookmark-check', class: 'w-4 h-4' }), I18N.t('speedread.toBookmark')]);
      const secondaryRow = Utils.el('div', { class: 'grid grid-cols-3 gap-2' }, [toStartBtn, bookmarkBtn, toBookmarkBtn]);

      root.appendChild(header);
      root.appendChild(progressLabel);
      root.appendChild(barOuter);
      root.appendChild(stage);
      root.appendChild(speedRow);
      root.appendChild(slider);
      root.appendChild(primaryRow);
      root.appendChild(secondaryRow);
      Utils.refreshIcons();

      function setWpm(v) {
        state.wpm = Math.min(MAX_WPM, Math.max(MIN_WPM, v));
        wpmLabel.textContent = String(state.wpm);
        slider.value = state.wpm;
      }

      function updateWord() {
        const word = state.words[state.idx] || '';
        const pIdx = Math.min(pivotIndex(word.length), Math.max(0, word.length - 1));
        leftEl.textContent = word.slice(0, pIdx);
        pivotEl.textContent = word[pIdx] || '';
        rightEl.textContent = word.slice(pIdx + 1);
        progressLabel.textContent = I18N.t('speedread.progress', { i: state.idx + 1, n: state.words.length });
        barInner.style.width = `${(state.idx / Math.max(1, state.words.length - 1)) * 100}%`;
        toBookmarkBtn.disabled = state.bookmark == null;
      }

      function updateToggleBtn() {
        toggleBtn.innerHTML = '';
        toggleBtn.appendChild(Utils.el('i', { 'data-lucide': state.playing ? 'pause' : 'play', class: 'w-5 h-5' }));
        toggleBtn.append(state.playing ? I18N.t('speedread.pause') : I18N.t('speedread.start'));
        Utils.refreshIcons();
      }

      function scheduleTick() {
        const word = state.words[state.idx];
        state.timer = setTimeout(advance, msForWord(word, state.wpm));
      }

      function advance() {
        if (state.idx >= state.words.length - 1) { pause(); return; }
        state.idx++;
        updateWord();
        scheduleTick();
      }

      function play() {
        if (state.playing || !state.words.length) return;
        if (state.idx >= state.words.length - 1) state.idx = 0;
        state.playing = true;
        updateToggleBtn();
        updateWord();
        scheduleTick();
      }

      function pause() {
        state.playing = false;
        clearTimeout(state.timer);
        updateToggleBtn();
      }

      function toggle() {
        if (state.playing) pause(); else play();
      }

      function toBeginning() {
        pause();
        state.idx = 0;
        updateWord();
      }

      function setBookmark() {
        state.bookmark = state.idx;
        updateWord();
      }

      function goToBookmark() {
        if (state.bookmark == null) return;
        pause();
        state.idx = state.bookmark;
        updateWord();
      }

      updateWord();
      updateToggleBtn();
      registerSpaceToggle(stage, toggle);
    }
  }

  // пробел переключает старт/паузу, пока экран чтения виден; слушатель
  // само-снимается при первом же пробеле после того, как экран закрыт
  // (root пересоздаётся при переходе в меню/настройки — своего unmount-хука нет)
  function registerSpaceToggle(stage, toggle) {
    document.addEventListener('keydown', function onKeydown(e) {
      if (!stage.isConnected) { document.removeEventListener('keydown', onKeydown); return; }
      if (e.code !== 'Space') return;
      e.preventDefault();
      toggle();
    });
  }

  return { id: 'speedread', titleKey: 'game.speedread.title', descKey: 'game.speedread.desc', icon: 'zap', color: 'bg-violet-500', mount };
})();
</script>
  <script>
// Экран статистики — графики прогресса по каждому режиму/уровню тренажёра
const StatsView = (() => {
  const GAMES_META = [
    { game: GameLine, stroke: '#818cf8', higherIsBetter: true, fmt: v => `${v}` },
    { game: GameMath, stroke: '#34d399', higherIsBetter: true, fmt: v => `${v}` },
    { game: GamePairs, stroke: '#fb7185', higherIsBetter: true, fmt: v => `${v}` },
    { game: GameSchulte, stroke: '#fbbf24', higherIsBetter: false, fmt: v => Utils.fmtTime(v) },
    { game: GameWords, stroke: '#22d3ee', higherIsBetter: true, fmt: v => `${v}` },
    { game: GameSumer, stroke: '#2dd4bf', higherIsBetter: true, fmt: v => `${v}` },
  ];

  function svgEl(tag, attrs = {}) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  }

  function buildChart(history, meta) {
    const W = 100, H = 36;
    if (history.length < 2) {
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'w-full h-16' });
      const text = svgEl('text', { x: W / 2, y: H / 2, fill: '#64748b', 'font-size': '5', 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
      text.textContent = I18N.t('stats.playAgain');
      svg.appendChild(text);
      return svg;
    }
    const values = history.map(h => h.v);
    const plotVals = meta.higherIsBetter ? values : values.map(v => -v);
    const min = Math.min(...plotVals), max = Math.max(...plotVals);
    const range = max - min || 1;
    const pts = plotVals.map((v, i) => {
      const x = (i / (history.length - 1)) * W;
      const y = H - 4 - ((v - min) / range) * (H - 8);
      return [x, y];
    });
    const pointsAttr = pts.map(p => p.join(',')).join(' ');
    const areaAttr = `0,${H} ${pointsAttr} ${W},${H}`;

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'w-full h-16', preserveAspectRatio: 'none' });
    svg.appendChild(svgEl('polygon', { points: areaAttr, fill: meta.stroke, 'fill-opacity': '0.12', stroke: 'none' }));
    svg.appendChild(svgEl('polyline', { points: pointsAttr, fill: 'none', stroke: meta.stroke, 'stroke-width': '1.6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    const last = pts[pts.length - 1];
    svg.appendChild(svgEl('circle', { cx: last[0], cy: last[1], r: '2', fill: meta.stroke }));
    return svg;
  }

  function buildCard(meta) {
    const variants = meta.game.historyVariants();
    let activeKey = variants[0].key;
    let bestCount = -1;
    variants.forEach(v => {
      const len = Utils.getHistory(v.key).length;
      if (len > bestCount) { bestCount = len; activeKey = v.key; }
    });

    const card = Utils.el('div', { class: 'p-4 rounded-md border border-slate-700 bg-slate-800/50' });
    const chartHolder = Utils.el('div', {});
    const metaLine = Utils.el('div', { class: 'flex items-center justify-between mt-2 text-xs text-slate-500' });
    const sessionsLabel = Utils.el('span', { class: 'text-xs text-slate-500' });

    const select = Utils.el('select', {
      class: 'bg-slate-900 border border-slate-700 rounded-md text-xs text-slate-300 px-2 py-1 max-w-[55%]',
      onchange: (e) => renderVariant(e.target.value),
    }, variants.map(v => Utils.el('option', { value: v.key }, v.label)));
    select.value = activeKey;

    card.appendChild(Utils.el('div', { class: 'flex items-center justify-between mb-2 gap-2' }, [
      Utils.el('div', { class: 'flex items-center gap-2 shrink-0' }, [
        Utils.el('i', { 'data-lucide': meta.game.icon, class: 'w-4 h-4 text-slate-400' }),
        Utils.el('span', { class: 'font-semibold text-slate-100 text-sm' }, I18N.t(meta.game.titleKey)),
      ]),
      select,
    ]));
    card.appendChild(sessionsLabel);
    card.appendChild(chartHolder);
    card.appendChild(metaLine);

    function renderVariant(key) {
      const history = Utils.getHistory(key);
      sessionsLabel.textContent = I18N.t('stats.sessions', { n: history.length });
      chartHolder.innerHTML = '';
      chartHolder.appendChild(buildChart(history, meta));
      metaLine.innerHTML = '';
      if (history.length) {
        const vals = history.map(h => h.v);
        const bestVal = meta.higherIsBetter ? Math.max(...vals) : Math.min(...vals);
        const lastVal = vals[vals.length - 1];
        metaLine.appendChild(Utils.el('span', {}, I18N.t('stats.last', { v: meta.fmt(lastVal) })));
        metaLine.appendChild(Utils.el('span', {}, I18N.t('stats.best', { v: meta.fmt(bestVal) })));
      }
    }
    renderVariant(activeKey);

    return card;
  }

  function mount(root, onExit) {
    root.innerHTML = '';
    const wrap = Utils.el('div', { class: 'space-y-4' });
    GAMES_META.forEach(meta => wrap.appendChild(buildCard(meta)));
    root.appendChild(wrap);
    Utils.refreshIcons();
  }

  return { id: 'stats', titleKey: 'game.stats.title', descKey: 'game.stats.desc', icon: 'bar-chart-3', color: 'bg-slate-700', mount };
})();
</script>
  <script>
// Меню и навигация между тренажёрами
(() => {
  const root = document.getElementById('app-root');
  const games = [GameLine, GameMath, GameSumer, GamePairs, GameSchulte, GameWords, GameEdubba, GameSpeedRead];
  const menuItems = [...games, StatsView];

  function langToggle() {
    const other = I18N.getLang() === 'ru' ? 'en' : 'ru';
    return Utils.el('button', {
      class: 'shrink-0 px-3 py-1.5 rounded-md border border-slate-700 bg-slate-900 text-xs font-bold text-slate-300 hover:border-indigo-400',
      onclick: () => { I18N.setLang(other); showMenu(); },
    }, I18N.getLang().toUpperCase());
  }

  function showMenu() {
    document.title = I18N.t('app.title');
    root.innerHTML = '';
    const header = Utils.el('div', { class: 'px-5 pt-6 pb-4 flex items-start justify-between gap-3' }, [
      Utils.el('div', {}, [
        Utils.el('h1', { class: 'text-2xl font-extrabold text-slate-100' }, I18N.t('app.title')),
        Utils.el('p', { class: 'text-sm text-slate-500 mt-1' }, I18N.t('app.subtitle')),
      ]),
      langToggle(),
    ]);

    const list = Utils.el('div', { class: 'px-4 pb-8 space-y-3' });
    menuItems.forEach(g => {
      const card = Utils.el('button', {
        class: 'w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-md hover:border-indigo-400 active:scale-[.98] transition text-left',
        onclick: () => openGame(g),
      }, [
        Utils.el('div', { class: `w-12 h-12 shrink-0 rounded-md flex items-center justify-center ${g.color}` }, [
          Utils.el('i', { 'data-lucide': g.icon, class: 'w-6 h-6 text-white' }),
        ]),
        Utils.el('div', { class: 'flex-1 min-w-0' }, [
          Utils.el('div', { class: 'font-bold text-slate-100' }, I18N.t(g.titleKey)),
          Utils.el('div', { class: 'text-xs text-slate-500 mt-0.5' }, I18N.t(g.descKey)),
        ]),
      ]);
      list.appendChild(card);
    });

    root.appendChild(header);
    root.appendChild(list);
    Utils.refreshIcons();
  }

  function openGame(g) {
    root.innerHTML = '';
    const bar = Utils.el('div', { class: 'sticky top-0 z-20 flex items-center gap-2 px-3 py-3 bg-slate-950/90 backdrop-blur border-b border-slate-800' }, [
      Utils.el('button', {
        class: 'w-9 h-9 flex items-center justify-center rounded-md hover:bg-slate-800 active:scale-95 transition text-slate-300',
        onclick: showMenu,
      }, [Utils.el('i', { 'data-lucide': 'arrow-left', class: 'w-5 h-5' })]),
      Utils.el('div', { class: 'font-bold text-slate-100' }, I18N.t(g.titleKey)),
    ]);
    const body = Utils.el('div', { class: 'p-4' });
    root.appendChild(bar);
    root.appendChild(body);
    Utils.refreshIcons();
    g.mount(body, showMenu);
  }

  showMenu();
})();
</script>
