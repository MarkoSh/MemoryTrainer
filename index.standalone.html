<style>
* { font-family: 'Inter', system-ui, sans-serif; }
.thai { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }

body { -webkit-tap-highlight-color: transparent; }

body { background: #020617; }

.app-shell {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app-card {
  width: 100%;
  max-width: 768px; /* iPad width cap, even on desktop */
  min-height: 100vh;
  background: #020617;
}
@media (min-width: 640px) {
  .app-card {
    min-height: 0;
    margin: 24px 0;
    border: 1px solid #1e293b;
    border-radius: 8px;
    overflow: hidden;
  }
}

/* Flip card */
.flip-card { perspective: 800px; }
.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .35s cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
}
.flip-card.is-hidden .flip-inner { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  backface-visibility: hidden;
  border-radius: 6px;
}
.flip-face.back { transform: rotateY(180deg); }

@keyframes shake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(3px); }
  30%, 50%, 70% { transform: translateX(-5px); }
  40%, 60% { transform: translateX(5px); }
}
.shake { animation: shake .5s; }

@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}
.pulse-dot { animation: pulse-dot 1.4s infinite; }

@keyframes pop-in {
  from { opacity: 0; transform: scale(.85); }
  to { opacity: 1; transform: scale(1); }
}
.pop-in { animation: pop-in .2s ease-out; }

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* Spritz RSVP speed-reading display */
.spritz-stage { position: relative; height: 110px; display: flex; align-items: center; }
.spritz-word { display: flex; align-items: baseline; width: 100%; font-size: 2.1rem; font-weight: 800; white-space: nowrap; overflow: hidden; }
.spritz-left { flex: 1 1 0; text-align: right; color: #e2e8f0; }
.spritz-right { flex: 1 1 0; text-align: left; color: #e2e8f0; }
.spritz-pivot { flex: none; color: #f43f5e; }
.spritz-tick { position: absolute; left: 50%; width: 2px; height: 12px; background: #f43f5e; opacity: .5; transform: translateX(-50%); }
.spritz-tick.top { top: 4px; }
.spritz-tick.bottom { bottom: 4px; }
</style>
</head>

    // в некоторых WebView) выглядит как совершенно пустой экран без единой подсказки —
    // а на телефоне консоль разработчика не открыть
    window.addEventListener('error', (e) => {
      const root = document.getElementById('app-root');
      if (root && !root.hasChildNodes()) {
        root.innerHTML = '<pre style="color:#f87171;padding:16px;white-space:pre-wrap;font-size:12px">' +
          'Ошибка запуска:\n' + (e.error && e.error.stack || e.message) + '</pre>';
      }
    });
  </script>
  <script>
// Общие утилиты и наборы символов для всех тренажёров
const ICON_POOL = ['star','heart','sun','moon','cloud','umbrella','anchor','bell','book-open','camera',
  'car','cat','coffee','gift','key','leaf','map-pin','music','phone','rocket',
  'scissors','shield','smile','trophy','watch','wifi','zap','flag','gem','flame',
  'snowflake','ghost','bike','fish','house'];

// полный тайский алфавит — все 44 согласные (включая 2 устаревшие: ฃ, ฅ)
const THAI_POOL = [
  { ch: 'ก', tr: 'k' }, { ch: 'ข', tr: 'kh' }, { ch: 'ฃ', tr: 'kh' }, { ch: 'ค', tr: 'kh' },
  { ch: 'ฅ', tr: 'kh' }, { ch: 'ฆ', tr: 'kh' }, { ch: 'ง', tr: 'ng' }, { ch: 'จ', tr: 'ch' },
  { ch: 'ฉ', tr: 'ch' }, { ch: 'ช', tr: 'ch' }, { ch: 'ซ', tr: 's' }, { ch: 'ฌ', tr: 'ch' },
  { ch: 'ญ', tr: 'y' }, { ch: 'ฎ', tr: 'd' }, { ch: 'ฏ', tr: 't' }, { ch: 'ฐ', tr: 'th' },
  { ch: 'ฑ', tr: 'th' }, { ch: 'ฒ', tr: 'th' }, { ch: 'ณ', tr: 'n' }, { ch: 'ด', tr: 'd' },
  { ch: 'ต', tr: 't' }, { ch: 'ถ', tr: 'th' }, { ch: 'ท', tr: 'th' }, { ch: 'ธ', tr: 'th' },
  { ch: 'น', tr: 'n' }, { ch: 'บ', tr: 'b' }, { ch: 'ป', tr: 'p' }, { ch: 'ผ', tr: 'ph' },
  { ch: 'ฝ', tr: 'f' }, { ch: 'พ', tr: 'ph' }, { ch: 'ฟ', tr: 'f' }, { ch: 'ภ', tr: 'ph' },
  { ch: 'ม', tr: 'm' }, { ch: 'ย', tr: 'y' }, { ch: 'ร', tr: 'r' }, { ch: 'ล', tr: 'l' },
  { ch: 'ว', tr: 'w' }, { ch: 'ศ', tr: 's' }, { ch: 'ษ', tr: 's' }, { ch: 'ส', tr: 's' },
  { ch: 'ห', tr: 'h' }, { ch: 'ฬ', tr: 'l' }, { ch: 'อ', tr: 'o' }, { ch: 'ฮ', tr: 'h' },
];

const Utils = (() => {
  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // берёт n случайных уникальных элементов из массива
  function sample(arr, n) {
    return shuffle(arr).slice(0, n);
  }

  // localStorage может бросать (напр. недоступное хранилище в WebView) —
  // без защиты это роняет весь обработчик клика на середине игры
  function getBest(key) {
    try { return localStorage.getItem('mt_best_' + key); } catch (e) { return null; }
  }
  function setBest(key, value, higherIsBetter) {
    const cur = getBest(key);
    if (cur == null || (higherIsBetter ? Number(value) > Number(cur) : Number(value) < Number(cur))) {
      try { localStorage.setItem('mt_best_' + key, value); } catch (e) { /* нет хранилища — рекорд просто не сохранится */ }
      return true;
    }
    return false;
  }

  const HISTORY_LIMIT = 30;
  function recordResult(gameId, value) {
    const key = 'mt_hist_' + gameId;
    let hist = [];
    try { hist = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { hist = []; }
    hist.push({ t: Date.now(), v: value });
    if (hist.length > HISTORY_LIMIT) hist = hist.slice(hist.length - HISTORY_LIMIT);
    try { localStorage.setItem(key, JSON.stringify(hist)); } catch (e) { /* нет хранилища — история просто не сохранится */ }
  }
  function getHistory(gameId) {
    try { return JSON.parse(localStorage.getItem('mt_hist_' + gameId)) || []; } catch (e) { return []; }
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    const cs = Math.floor((ms % 1000) / 10);
    return `${s}.${String(cs).padStart(2, '0')}с`;
  }

  // запускает CSS-переход полосы прогресса со 100% до 0%; принудительный reflow
  // между сбросом ширины и стартом transition — иначе браузер иногда схлопывает
  // оба изменения в один кадр и полоса скачет к 0% без анимации (заметно через раунд)
  function startBarDrain(el, durationMs) {
    el.style.transitionDuration = '0ms';
    el.style.width = '100%';
    void el.offsetWidth;
    requestAnimationFrame(() => {
      el.style.transitionDuration = durationMs + 'ms';
      el.style.width = '0%';
    });
  }

  // озвучка слов/букв через нативный Web Speech API — без внешних зависимостей
  function speak(text, lang) {
    if (!text || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel(); // обрываем предыдущую фразу, чтобы клики не ставились в очередь
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* Web Speech недоступен — молча игнорируем */ }
  }
  function getVoiceEnabled() { try { return localStorage.getItem('mt_voice_enabled') === '1'; } catch (e) { return false; } }
  function setVoiceEnabled(v) { try { localStorage.setItem('mt_voice_enabled', v ? '1' : '0'); } catch (e) { /* нет хранилища — переключится только на эту сессию */ } }

  // тумблер озвучки — общий для тренажёров со словами/буквами (Строчка, Слова)
  function buildVoiceToggle(onChange) {
    const enabled = getVoiceEnabled();
    const toggleBtn = el('button', {
      class: 'w-full flex items-center justify-between p-3 rounded-md border border-slate-700 bg-slate-800/50',
      onclick: () => { setVoiceEnabled(!enabled); onChange(); },
    }, [
      el('div', { class: 'flex items-center gap-2' }, [
        el('i', { 'data-lucide': 'volume-2', class: 'w-4 h-4 text-slate-400' }),
        el('span', { class: 'text-sm font-semibold text-slate-100' }, I18N.t('common.voice')),
      ]),
      el('span', { class: `w-10 h-6 rounded-full relative transition ${enabled ? 'bg-emerald-500' : 'bg-slate-700'}` },
        el('span', { class: `absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${enabled ? 'left-[18px]' : 'left-0.5'}` })
      ),
    ]);

    const help = el('details', { class: 'mt-1.5 px-1 text-xs text-slate-500' }, [
      el('summary', { class: 'cursor-pointer select-none text-slate-500 hover:text-slate-400 py-1' }, I18N.t('common.voiceHelpTitle')),
      el('div', { class: 'mt-1.5 space-y-1.5 pb-1' }, [
        el('p', {}, I18N.t('common.voiceHelpWindows')),
        el('p', {}, I18N.t('common.voiceHelpMac')),
        el('p', {}, I18N.t('common.voiceHelpIOS')),
        el('p', {}, I18N.t('common.voiceHelpAndroid')),
        el('p', {}, I18N.t('common.voiceHelpLinux')),
        el('p', { class: 'italic' }, I18N.t('common.voiceHelpNote')),
      ]),
    ]);

    return el('div', { class: 'mb-6' }, [toggleBtn, help]);
  }

  function refreshIcons() {
    if (window.lucide) window.lucide.createIcons({ icons: window.lucide.icons });
  }

  return { el, shuffle, randInt, sample, getBest, setBest, recordResult, getHistory, fmtTime, refreshIcons, startBarDrain, speak, getVoiceEnabled, setVoiceEnabled, buildVoiceToggle };
})();
</script>

  <script>
// Общий движок "эдубы" (шумерской школы писцов): блок материала осваивается целиком
// по циклу копирование (образец на виду) -> вспоминание (образца нет) -> проверка
// (порядок перемешан, без подсказок), и только после сдачи проверки открывается
// следующий блок. Движок не знает ни про слова, ни про числа — их даёт игра через cfg.
const Edubba = (() => {
  const PASS_PCT = 85;

  // освоенность блока хранится как лучший % проверки в общем Utils.getBest/setBest
  const masteryKey = id => 'edubba_' + id;
  const bestPct = id => { const v = Utils.getBest(masteryKey(id)); return v == null ? null : Number(v); };
  const isMastered = id => (bestPct(id) ?? -1) >= PASS_PCT;

  // список блоков: следующий открывается только после освоения предыдущего
  function renderLessons(lessons, onOpen) {
    return Utils.el('div', { class: 'space-y-2' }, lessons.map((l, i) => {
      const done = isMastered(l.id);
      const locked = i > 0 && !done && !isMastered(lessons[i - 1].id);
      const best = bestPct(l.id);
      const tone = locked ? 'border-slate-800 bg-slate-900/40 opacity-50'
        : done ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-slate-700 bg-slate-800/50 hover:border-indigo-400';
      return Utils.el('button', { class: `w-full flex items-center gap-3 p-3 rounded-md border text-left transition ${tone}`, onclick: locked ? null : () => onOpen(l) }, [
        Utils.el('i', { 'data-lucide': locked ? 'lock' : done ? 'circle-check' : 'circle', class: `w-5 h-5 shrink-0 ${done ? 'text-emerald-400' : 'text-slate-500'}` }),
        Utils.el('div', { class: 'flex-1 min-w-0' }, [
          Utils.el('div', { class: 'font-semibold text-slate-100 truncate' }, `${i + 1}. ${l.title}`),
          Utils.el('div', { class: 'text-xs text-slate-500' }, l.sub),
        ]),
        best != null ? Utils.el('span', { class: 'text-xs font-bold text-slate-400' }, `${best}%`) : null,
      ]);
    }));
  }

  // cfg: { id, title, items, prompt(item), model(item), makeInput(item, phase, submit),
  //        isCorrect(item, value), speak?(item), onExit() }
  // makeInput возвращает узел; при ошибке движок вызывает node.reset(), если он есть.
  function run(root, cfg) {
    const shake = el => { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); };
    const btn = (label, onclick, tone = 'bg-indigo-500 text-white hover:bg-indigo-400') =>
      Utils.el('button', { class: `w-full py-3 rounded-md font-bold active:scale-[.98] transition ${tone}`, onclick }, label);

    each('copy', cfg.items, () => each('recall', cfg.items, exam));

    function each(phase, list, done) {
      const results = [];
      next(0);
      function next(i) {
        if (i >= list.length) return done(results);
        screen(phase, list, i, ok => { results.push({ item: list[i], ok }); next(i + 1); });
      }
    }

    function screen(phase, list, i, finish) {
      const item = list[i];
      let mistakes = 0, settled = false;
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-xs text-slate-500 truncate' }, cfg.title));
      root.appendChild(Utils.el('div', { class: 'flex items-center justify-between mb-1' }, [
        Utils.el('span', { class: 'font-semibold text-slate-200' }, I18N.t('edubba.phase.' + phase)),
        Utils.el('span', { class: 'text-sm text-slate-500' }, `${i + 1} / ${list.length}`),
      ]));
      root.appendChild(Utils.el('div', { class: 'text-xs text-slate-500 mb-4' }, I18N.t('edubba.hint.' + phase)));
      const stage = Utils.el('div', { class: 'mb-5' }, phase === 'copy' ? cfg.model(item) : cfg.prompt(item));
      const area = Utils.el('div', {});
      root.appendChild(stage);
      root.appendChild(area);

      const showModel = () => { stage.innerHTML = ''; stage.appendChild(cfg.model(item)); };
      const reveal = () => {
        settled = true;
        showModel();
        area.innerHTML = '';
        area.appendChild(btn(I18N.t('edubba.next'), () => finish(false)));
      };

      const widget = cfg.makeInput(item, phase, value => {
        if (settled) return;
        if (cfg.isCorrect(item, value)) {
          settled = true;
          if (cfg.speak) cfg.speak(item);
          showModel();
          setTimeout(() => finish(phase === 'copy' || mistakes === 0), 600);
        } else {
          mistakes++;
          shake(widget);
          if (widget.reset) widget.reset();
          if (phase === 'exam' || (phase === 'recall' && mistakes >= 2)) reveal();
        }
      });
      area.appendChild(widget);
      if (phase === 'recall') {
        area.appendChild(Utils.el('button', {
          class: 'w-full mt-3 py-2 text-sm text-slate-500 hover:text-slate-300',
          onclick: reveal,
        }, I18N.t('edubba.peek')));
      }
    }

    function exam() {
      each('exam', Utils.shuffle(cfg.items), results => {
        const pct = Math.round(results.filter(r => r.ok).length / results.length * 100);
        Utils.setBest(masteryKey(cfg.id), pct, true);
        result(pct, results.filter(r => !r.ok).map(r => r.item));
      });
    }

    function result(pct, failed) {
      const pass = pct >= PASS_PCT;
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-6' }, [
        Utils.el('i', { 'data-lucide': pass ? 'trophy' : 'flag', class: `w-10 h-10 mx-auto mb-3 ${pass ? 'text-emerald-400' : 'text-slate-500'}` }),
        Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t(pass ? 'edubba.mastered' : 'edubba.notYet')),
        Utils.el('div', { class: 'text-slate-400 mt-1' }, `${pct}%` + (pass ? '' : ' · ' + I18N.t('edubba.need', { n: PASS_PCT }))),
      ]));
      if (failed.length) {
        root.appendChild(Utils.el('div', { class: 'text-xs text-slate-500 mb-2' }, I18N.t('edubba.mistakesList')));
        root.appendChild(Utils.el('div', { class: 'space-y-2 mb-5' }, failed.map(it => cfg.model(it))));
      }
      const row = Utils.el('div', { class: 'space-y-2' });
      if (!pass) row.appendChild(btn(I18N.t('edubba.repeat'), () => each('recall', failed, exam)));
      row.appendChild(btn(I18N.t('edubba.toList'), cfg.onExit, pass ? 'bg-indigo-500 text-white hover:bg-indigo-400' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'));
      root.appendChild(row);
      Utils.refreshIcons();
    }
  }

  return { renderLessons, isMastered, run };
})();

          setTimeout(() => showKeyboard(), 380);
        }, studyTime);
        state._studyTimeout = studyTimeout;
      } else {
        showKeyboard();
      }

      function showKeyboard() {
        highlightTarget();
        keyboardTokens.forEach(tok => {
          const btn = Utils.el('button', {
            class: 'aspect-square flex items-center justify-center rounded-md border border-slate-700 bg-slate-800 hover:border-indigo-400 active:scale-95 transition text-slate-100',
            onclick: () => { maybeSpeak(tok); handleGuess(tok, btn); },
          }, tokenNode(tok, false));
          btn.dataset.id = tok.id;
          keyboardWrap.appendChild(btn);
        });
        Utils.refreshIcons();
      }

      function highlightTarget() {
        cardEls.forEach(c => c.classList.remove('ring-2', 'ring-amber-400'));
        if (askPtr < askOrder.length) {
          cardEls[askOrder[askPtr]].classList.add('ring-2', 'ring-amber-400');
        }
      }

      function handleGuess(tok, btn) {
        if (askPtr >= askOrder.length) return;
        const targetIdx = askOrder[askPtr];
        const correct = sequence[targetIdx].id === tok.id;
        if (correct) {
          revealCard(targetIdx, sequence[targetIdx]);
          state.score += 10 + state.length;
          askPtr++;
          highlightTarget();
          updateHud();
          if (askPtr >= askOrder.length) advancePhase();
        } else {
          state.lives--;
          btn.classList.add('shake');
          setTimeout(() => btn.classList.remove('shake'), 500);
          state.score = Math.max(0, state.score - 5);
          updateHud();
          if (state.lives <= 0) gameOver(state);
        }
      }

      function revealCard(idx, tok) {
        const card = cardEls[idx];
        card.classList.remove('is-hidden');
        const front = card.querySelector('.flip-face.front');
        front.innerHTML = '';
        front.className = 'flip-face front bg-emerald-500/10 border border-emerald-500/50';
        front.appendChild(tokenNode(tok, true));
        Utils.refreshIcons();
      }

      function advancePhase() {
        clearTimeout(state._studyTimeout);
        setTimeout(() => {
          if (phaseIdx + 1 < phases.length) {
            playPhase(state, sequence, phases, phaseIdx + 1, false);
          } else {
            state.round++;
            playRound(state);
          }
        }, 900);
      }

      function useHint() {
        if (state.hints <= 0 || askPtr >= askOrder.length) return;
        state.hints--;
        state.score = Math.max(0, state.score - 15);
        const targetIdx = askOrder[askPtr];
        revealCard(targetIdx, sequence[targetIdx]);
        askPtr++;
        highlightTarget();
        updateHud();
        if (askPtr >= askOrder.length) advancePhase();
      }

      function header() {
        const hud = Utils.el('div', { class: 'flex items-center justify-between mb-4' }, [
          Utils.el('div', { class: 'text-sm font-semibold text-slate-400' }, I18N.t('line.round', { n: state.round })),
          Utils.el('div', { id: 'line-hearts', class: 'flex items-center gap-1' }),
          Utils.el('button', { id: 'line-hint-btn', class: 'flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-amber-500/15 text-amber-400', onclick: () => useHint() }, [
            Utils.el('i', { 'data-lucide': 'lightbulb', class: 'w-4 h-4' }),
            Utils.el('span', { id: 'line-hint-count' }, String(state.hints)),
          ]),
          Utils.el('span', { id: 'line-score', class: 'text-sm font-bold text-indigo-400' }, I18N.t('common.points', { n: state.score })),
        ]);
        setTimeout(updateHud, 0);
        return hud;
      }

      function updateHud() {
        const hearts = root.querySelector('#line-hearts');
        if (hearts) {
          hearts.innerHTML = '';
          for (let i = 0; i < 3; i++) {
            hearts.appendChild(Utils.el('i', { 'data-lucide': 'heart', class: `w-4 h-4 ${i < state.lives ? 'text-rose-500 fill-rose-500' : 'text-slate-700 fill-slate-700'}` }));
          }
        }
        const hintCount = root.querySelector('#line-hint-count');
        if (hintCount) hintCount.textContent = String(state.hints);
        const scoreEl = root.querySelector('#line-score');
        if (scoreEl) scoreEl.textContent = I18N.t('common.points', { n: state.score });
        Utils.refreshIcons();
      }
    }

    function gameOver(state) {
      const key = scoreKey(state.levelKey, state.roundType);
      const isBest = Utils.setBest(key, state.score, true);
      Utils.recordResult(key, state.score);
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': 'flag', class: 'w-10 h-10 mx-auto text-slate-500 mb-3' }),
        Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t('line.gameOver')),
        Utils.el('div', { class: 'text-slate-400 mt-1' }, I18N.t('line.scoreLine', { score: state.score }) + (isBest ? I18N.t('common.newRecord') : '')),
        Utils.el('div', { class: 'flex gap-2 justify-center mt-6' }, [
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-indigo-500 text-white font-semibold hover:bg-indigo-400', onclick: () => startGame(state.levelKey, state.roundType, state.length) }, I18N.t('common.playAgain')),
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: onExit }, I18N.t('common.toMenu')),
        ]),
      ]));
      Utils.refreshIcons();
    }
  }

  return { id: 'line', titleKey: 'game.line.title', descKey: 'game.line.desc', icon: 'rows-3', color: 'bg-indigo-500', historyVariants, mount };
})();

  <script>
// Тренажёр "Математика" — вычисли выражение, выбери ответ из 5 вариантов
const GameMath = (() => {
  const QUESTIONS_TOTAL = 10;
  const LEVELS = [
    { nameKey: 'math.level1', ops: 1, brackets: false, range: 20, time: 10000 },
    { nameKey: 'math.level2', ops: 2, brackets: false, range: 20, time: 13000 },
    { nameKey: 'math.level3', ops: 3, brackets: true, range: 12, time: 18000 },
  ];

  function historyVariants() {
    return LEVELS.map((lv, i) => ({ key: `math_${i}`, label: I18N.t(lv.nameKey) }));
  }

  function randOp() { return Utils.sample(['+', '-', '*'], 1)[0]; }

  function apply(a, op, b) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    return a * b;
  }

  // строит случайное выражение из N чисел/операций, опционально со скобками
  function buildExpr(level) {
    const nums = [];
    const ops = [];
    const count = level.ops + 1;
    for (let i = 0; i < count; i++) nums.push(Utils.randInt(2, level.range));
    for (let i = 0; i < level.ops; i++) ops.push(randOp());

    let exprStr = String(nums[0]);
    let value;
    if (level.brackets && ops.length >= 2) {
      const bi = Utils.randInt(0, ops.length - 2);
      exprStr = wrapBrackets(nums, ops, bi);
      value = evalBracketed(nums, ops, bi);
    } else {
      for (let i = 0; i < ops.length; i++) exprStr += ` ${ops[i]} ${nums[i + 1]}`;
      value = nums[0];
      for (let i = 0; i < ops.length; i++) value = apply(value, ops[i], nums[i + 1]);
    }
    return { text: exprStr, value };
  }

  function wrapBrackets(nums, ops, bi) {
    let s = '';
    for (let i = 0; i < nums.length; i++) {
      if (i === bi) s += '(';
      s += nums[i];
      if (i === bi + 1) s += ')';
      if (i < ops.length) s += ` ${ops[i]} `;
    }
    return s;
  }

  function evalBracketed(nums, ops, bi) {
    const inner = apply(nums[bi], ops[bi], nums[bi + 1]);
    const seq = [...nums.slice(0, bi), inner, ...nums.slice(bi + 2)];
    const seqOps = [...ops.slice(0, bi), ...ops.slice(bi + 1)];
    let value = seq[0];
    for (let i = 0; i < seqOps.length; i++) value = apply(value, seqOps[i], seq[i + 1]);
    return value;
  }

  function buildOptions(correct) {
    const set = new Set([correct]);
    while (set.size < 5) {
      const delta = Utils.randInt(-6, 6) || 1;
      set.add(correct + delta);
    }
    return Utils.shuffle([...set]);
  }

  function mount(root, onExit) {
    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('math.chooseLevel', { n: QUESTIONS_TOTAL })));
      root.appendChild(Utils.el('div', { class: 'grid grid-cols-1 gap-2 mb-6' }, LEVELS.map((lv, i) => {
        const best = Utils.getBest(`math_${i}`);
        return Utils.el('button', {
          class: 'p-4 rounded-md border border-slate-700 bg-slate-800/50 text-left hover:border-indigo-400 transition',
          onclick: () => startGame(i),
        }, [
          Utils.el('div', { class: 'font-semibold text-slate-100' }, I18N.t(lv.nameKey)),
          Utils.el('div', { class: 'text-xs text-slate-500' }, best ? I18N.t('math.recordN', { n: best }) : I18N.t('math.notPlayed')),
        ]);
      })));
      Utils.refreshIcons();
    }

    function startGame(levelIdx) {
      const state = { levelIdx, score: 0, lives: 3, hints: 2, qIndex: 0, correct: 0 };
      runQuestion(state);
    }

    function runQuestion(state) {
      const level = LEVELS[state.levelIdx];
      const { text, value } = buildExpr(level);
      const options = buildOptions(value);
      let eliminated = [];
      let answered = false;

      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'flex items-center justify-between mb-2' }, [
        Utils.el('div', { class: 'flex items-center gap-1', id: 'math-hearts' }),
        Utils.el('div', { id: 'math-progress', class: 'text-sm font-semibold text-slate-400' }, I18N.t('math.question', { i: state.qIndex + 1, n: QUESTIONS_TOTAL })),
      ]));
      root.appendChild(Utils.el('div', { class: 'flex items-center justify-between mb-6' }, [
        Utils.el('div', { id: 'math-score', class: 'text-sm font-bold text-indigo-400' }, I18N.t('common.points', { n: state.score })),
        Utils.el('button', {
          class: 'flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-amber-500/15 text-amber-400',
          onclick: () => useHint(),
        }, [Utils.el('i', { 'data-lucide': 'lightbulb', class: 'w-4 h-4' }), Utils.el('span', { id: 'math-hint-count' }, ` ${state.hints}`)]),
      ]));

      const barOuter = Utils.el('div', { class: 'w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-6' });
      const barInner = Utils.el('div', { class: 'h-full bg-emerald-500', style: 'width:100%;transition:width linear' });
      barOuter.appendChild(barInner);
      root.appendChild(barOuter);

      root.appendChild(Utils.el('div', { class: 'text-center text-3xl font-extrabold mb-8 pop-in tracking-wide text-slate-100' }, text + ' = ?'));

      const optsWrap = Utils.el('div', { class: 'grid grid-cols-1 gap-2' });
      root.appendChild(optsWrap);
      renderOptions();
      updateHud();
      Utils.refreshIcons();

      Utils.startBarDrain(barInner, level.time);
      const timeout = setTimeout(() => handleAnswer(null), level.time);

      function renderOptions() {
        optsWrap.innerHTML = '';
        options.forEach(opt => {
          if (eliminated.includes(opt)) {
            optsWrap.appendChild(Utils.el('button', { class: 'py-3 rounded-md border border-slate-800 text-slate-700', disabled: 'true' }, String(opt)));
            return;
          }
          optsWrap.appendChild(Utils.el('button', {
            class: 'py-3 rounded-md border border-slate-700 bg-slate-800/50 font-bold text-lg text-slate-100 hover:border-indigo-400 active:scale-95 transition',
            onclick: (e) => handleAnswer(opt, e.currentTarget),
          }, String(opt)));
        });
      }

      function handleAnswer(opt, btnEl) {
        if (answered) return;
        answered = true;
        clearTimeout(timeout);
        if (opt === value) {
          state.score += 15;
          state.correct++;
          if (btnEl) btnEl.classList.add('border-emerald-500', 'bg-emerald-500/10');
          proceed();
        } else {
          state.lives--;
          if (btnEl) btnEl.classList.add('border-rose-500', 'bg-rose-500/10', 'shake');
          state.score = Math.max(0, state.score - 5);
          updateHud();
          proceed();
        }
      }

      function proceed() {
        state.qIndex++;
        if (state.lives <= 0 || state.qIndex >= QUESTIONS_TOTAL) {
          setTimeout(() => gameOver(state), 600);
        } else {
          setTimeout(() => runQuestion(state), 600);
        }
      }

      function useHint() {
        if (state.hints <= 0 || answered) return;
        state.hints--;
        state.score = Math.max(0, state.score - 10);
        const wrongOpts = options.filter(o => o !== value && !eliminated.includes(o));
        eliminated.push(...Utils.sample(wrongOpts, Math.min(2, wrongOpts.length)));
        renderOptions();
        updateHud();
      }

      function updateHud() {
        const hearts = root.querySelector('#math-hearts');
        if (hearts) {
          hearts.innerHTML = '';
          for (let i = 0; i < 3; i++) hearts.appendChild(Utils.el('i', { 'data-lucide': 'heart', class: `w-4 h-4 ${i < state.lives ? 'text-rose-500 fill-rose-500' : 'text-slate-700 fill-slate-700'}` }));
        }
        const scoreEl = root.querySelector('#math-score');
        if (scoreEl) scoreEl.textContent = I18N.t('common.points', { n: state.score });
        const hintEl = root.querySelector('#math-hint-count');
        if (hintEl) hintEl.textContent = ` ${state.hints}`;
        Utils.refreshIcons();
      }
    }

    function gameOver(state) {
      const key = `math_${state.levelIdx}`;
      const isBest = Utils.setBest(key, state.score, true);
      Utils.recordResult(key, state.score);
      const accuracy = Math.round((state.correct / QUESTIONS_TOTAL) * 100);
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': 'calculator', class: 'w-10 h-10 mx-auto text-slate-500 mb-3' }),
        Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t('math.result')),
        Utils.el('div', { class: 'text-slate-400 mt-1' }, I18N.t('math.correct', { c: state.correct, t: QUESTIONS_TOTAL, pct: accuracy })),
        Utils.el('div', { class: 'text-slate-400' }, I18N.t('math.scoreLine', { score: state.score }) + (isBest ? I18N.t('common.newRecord') : '')),
        Utils.el('div', { class: 'flex gap-2 justify-center mt-6' }, [
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-indigo-500 text-white font-semibold hover:bg-indigo-400', onclick: () => startGame(state.levelIdx) }, I18N.t('common.playAgain')),
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: onExit }, I18N.t('common.toMenu')),
        ]),
      ]));
      Utils.refreshIcons();
    }
  }

  return { id: 'math', titleKey: 'game.math.title', descKey: 'game.math.desc', icon: 'calculator', color: 'bg-emerald-500', historyVariants, mount };
})();

// Тренажёр "Пары" — классическая игра на память, найди все пары карточек
const GamePairs = (() => {
  const SYMBOL_SETS = {
    icons: { nameKey: 'pairs.setIcons', pool: ICON_POOL.map(name => ({ id: name, icon: name })) },
    thai: { nameKey: 'pairs.setThai', pool: THAI_POOL.map(t => ({ id: t.ch, ch: t.ch, tr: t.tr })) },
  };

  const LEVELS = [
    { nameKey: 'pairs.levelEasy', cols: 4, rows: 4, memorize: 5000, mistakesAllowed: 6, hints: 2 },
    { nameKey: 'pairs.levelMedium', cols: 6, rows: 6, memorize: 4000, mistakesAllowed: 4, hints: 1 },
    { nameKey: 'pairs.levelHard', cols: 6, rows: 8, memorize: 3000, mistakesAllowed: 2, hints: 0 },
  ];

  function historyVariants() {
    const arr = [];
    LEVELS.forEach((lv, i) => {
      Object.entries(SYMBOL_SETS).forEach(([sk, s]) => {
        arr.push({ key: `pairs_${i}_${sk}`, label: `${I18N.t(lv.nameKey)} · ${I18N.t(s.nameKey)}` });
      });
    });
    return arr;
  }

  function tokenNode(token, big) {
    if (token.icon) {
      return Utils.el('i', { 'data-lucide': token.icon, class: big ? 'w-6 h-6 sm:w-7 sm:h-7' : 'w-5 h-5' });
    }
    return Utils.el('div', { class: 'flex flex-col items-center leading-none' }, [
      Utils.el('span', { class: `thai ${big ? 'text-xl sm:text-2xl' : 'text-lg'} font-bold` }, token.ch),
      Utils.el('span', { class: 'text-[8px] text-slate-500 mt-0.5' }, token.tr),
    ]);
  }

  function mount(root, onExit) {
    let symbolKey = 'icons';
    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'mb-5' }, [
        Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('pairs.symbolSet')),
        Utils.el('div', { class: 'grid grid-cols-2 gap-2' }, Object.entries(SYMBOL_SETS).map(([key, s]) =>
          Utils.el('button', {
            class: `p-3 rounded-md border text-center transition ${symbolKey === key ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 bg-slate-800/50'}`,
            onclick: () => { symbolKey = key; renderSetup(); },
          }, Utils.el('div', { class: 'font-semibold text-slate-100 text-sm' }, I18N.t(s.nameKey)))
        )),
      ]));
      root.appendChild(Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('common.chooseLevel')));
      root.appendChild(Utils.el('div', { class: 'grid grid-cols-1 gap-2' }, LEVELS.map((lv, i) => {
        const best = Utils.getBest(`pairs_${i}_${symbolKey}`);
        return Utils.el('button', {
          class: 'p-4 rounded-md border border-slate-700 bg-slate-800/50 text-left hover:border-indigo-400 transition',
          onclick: () => startGame(i, symbolKey),
        }, [
          Utils.el('div', { class: 'font-semibold text-slate-100' }, `${I18N.t(lv.nameKey)} — ${lv.cols}×${lv.rows}`),
          Utils.el('div', { class: 'text-xs text-slate-500' }, I18N.t('pairs.memorizeInfo', { s: (lv.memorize / 1000).toFixed(0), m: lv.mistakesAllowed }) + (best ? ` · ${I18N.t('common.record')}: ${best}` : '')),
        ]);
      })));
      Utils.refreshIcons();
    }

    function startGame(levelIdx, symbolKey) {
      const level = LEVELS[levelIdx];
      const pool = SYMBOL_SETS[symbolKey].pool;
      const total = level.cols * level.rows;
      const pairsCount = total / 2;
      const uniq = Utils.sample(pool, pairsCount);
      const deck = Utils.shuffle([...uniq, ...uniq]).map(token => ({ token, matched: false }));

      const state = { levelIdx, symbolKey, level, deck, mistakes: 0, score: 1000, hints: level.hints, flipped: [], locked: true, startedAt: 0, matchedPairs: 0, timerId: null };

      root.innerHTML = '';
      root.appendChild(hud());
      const grid = Utils.el('div', {
        class: 'grid gap-1.5 no-scrollbar',
        style: `grid-template-columns:repeat(${level.cols},1fr);`,
      });
      root.appendChild(grid);

      const cardEls = state.deck.map((card, i) => {
        const front = Utils.el('div', { class: 'flip-face front bg-slate-800 border border-slate-700 text-slate-100' }, tokenNode(card.token, true));
        const back = Utils.el('div', { class: 'flip-face back bg-indigo-500/20 border border-indigo-500/40' }, Utils.el('span', { class: 'text-indigo-300 font-bold' }, '?'));
        const inner = Utils.el('div', { class: 'flip-inner' }, [front, back]);
        const el = Utils.el('div', {
          class: 'flip-card aspect-square cursor-pointer',
          onclick: () => onCardClick(i),
        }, inner);
        grid.appendChild(el);
        return el;
      });
      Utils.refreshIcons();

      // фаза запоминания: карточки открыты
      const barOuter = root.querySelector('#pairs-bar-outer');
      const barInner = root.querySelector('#pairs-bar-inner');
      Utils.startBarDrain(barInner, level.memorize);
      setTimeout(() => {
        cardEls.forEach(c => c.classList.add('is-hidden'));
        setTimeout(() => {
          state.locked = false;
          state.startedAt = Date.now();
          startTimer();
          barOuter.classList.add('invisible');
        }, 380);
      }, level.memorize);

      function startTimer() {
        state.timerId = setInterval(() => {
          const timeEl = root.querySelector('#pairs-time');
          if (timeEl) timeEl.textContent = Utils.fmtTime(Date.now() - state.startedAt);
        }, 50);
      }

      function onCardClick(i) {
        if (state.locked) return;
        const card = state.deck[i];
        if (card.matched || state.flipped.includes(i)) return;
        cardEls[i].classList.remove('is-hidden');
        state.flipped.push(i);
        if (state.flipped.length === 2) {
          state.locked = true;
          const [a, b] = state.flipped;
          if (state.deck[a].token.id === state.deck[b].token.id) {
            state.deck[a].matched = state.deck[b].matched = true;
            cardEls[a].classList.add('opacity-40');
            cardEls[b].classList.add('opacity-40');
            state.matchedPairs++;
            state.flipped = [];
            state.locked = false;
            if (state.matchedPairs === pairsCount) finishGame(state);
          } else {
            state.mistakes++;
            state.score = Math.max(0, state.score - 20);
            cardEls[a].classList.add('shake');
            cardEls[b].classList.add('shake');
            updateHud(state);
            setTimeout(() => {
              cardEls[a].classList.remove('shake');
              cardEls[b].classList.remove('shake');
              cardEls[a].classList.add('is-hidden');
              cardEls[b].classList.add('is-hidden');
              state.flipped = [];
              state.locked = false;
              if (state.mistakes >= level.mistakesAllowed) gameOver(state);
            }, 700);
          }
        }
        updateHud(state);
      }

      function useHint() {
        if (state.hints <= 0 || state.locked || state.flipped.length) return;
        state.hints--;
        state.score = Math.max(0, state.score - 60);
        state.locked = true;
        cardEls.forEach((c, i) => { if (!state.deck[i].matched) c.classList.remove('is-hidden'); });
        setTimeout(() => {
          cardEls.forEach((c, i) => { if (!state.deck[i].matched) c.classList.add('is-hidden'); });
          state.locked = false;
        }, 1000);
        updateHud(state);
      }

      function hud() {
        const wrap = Utils.el('div', { class: 'mb-3' }, [
          Utils.el('div', { class: 'flex items-center justify-between mb-2' }, [
            Utils.el('div', { class: 'text-sm font-semibold text-slate-400' }, I18N.t('pairs.label')),
            Utils.el('div', { id: 'pairs-time', class: 'text-sm font-mono text-slate-400' }, '0.00с'),
            Utils.el('button', {
              class: 'flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-amber-500/15 text-amber-400 disabled:opacity-30',
              onclick: () => useHint(),
            }, [Utils.el('i', { 'data-lucide': 'lightbulb', class: 'w-4 h-4' }), Utils.el('span', { id: 'pairs-hints' }, ` ${state.hints}`)]),
          ]),
          Utils.el('div', { id: 'pairs-mistakes', class: 'text-xs text-rose-400 mb-2' }, ''),
          Utils.el('div', { id: 'pairs-bar-outer', class: 'w-full h-1.5 bg-slate-800 rounded-full overflow-hidden' }, Utils.el('div', { id: 'pairs-bar-inner', class: 'h-full bg-indigo-500', style: 'width:100%;transition:width linear' })),
        ]);
        setTimeout(() => updateHud(state), 0);
        Utils.refreshIcons();

      }

      function updateHud(state) {
        const mistakesEl = root.querySelector('#pairs-mistakes');
        if (mistakesEl) mistakesEl.textContent = I18N.t('pairs.mistakes', { m: state.mistakes, allowed: level.mistakesAllowed });
        const hintsEl = root.querySelector('#pairs-hints');
        if (hintsEl) hintsEl.textContent = ` ${state.hints}`;
        Utils.refreshIcons();
      }
    }

    function finishGame(state) {
      clearInterval(state.timerId);
      const elapsed = Date.now() - state.startedAt;
      const finalScore = Math.max(50, state.score - Math.floor(elapsed / 1000) * 5);
      const key = `pairs_${state.levelIdx}_${state.symbolKey}`;
      const isBest = Utils.setBest(key, finalScore, true);
      Utils.recordResult(key, finalScore);
      showResult(state, true, finalScore, isBest, elapsed);
    }

    function gameOver(state) {
      clearInterval(state.timerId);
      showResult(state, false, 0, false, Date.now() - state.startedAt);
    }

    function showResult(state, won, finalScore, isBest, elapsed) {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': won ? 'party-popper' : 'flag', class: `w-10 h-10 mx-auto mb-3 ${won ? 'text-emerald-400' : 'text-slate-500'}` }),

          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: onExit }, I18N.t('common.toMenu')),
        ]),
      ]));

  }

  return { id: 'pairs', titleKey: 'game.pairs.title', descKey: 'game.pairs.desc', icon: 'layout-grid', color: 'bg-rose-500', historyVariants, mount };

  <script>
// Тренажёр "Таблицы Шульте" — находи числа по порядку, не отводя взгляд от центра
const GameSchulte = (() => {
  // сетки всегда чётные — иначе точка фиксации в центре закрывает число
  const LEVELS = [
    { nameKey: 'schulte.levelClassic', descKey: 'schulte.levelClassicDesc', size: 4, mode: 'static' },
    { nameKey: 'schulte.levelMoving', descKey: 'schulte.levelMovingDesc', size: 6, mode: 'reshuffle-order' },
    { nameKey: 'schulte.levelPeriphery', descKey: 'schulte.levelPeripheryDesc', size: 8, mode: 'reshuffle-random' },
  ];

  function historyVariants() {
    return LEVELS.map((lv, i) => ({ key: `schulte_${i}`, label: I18N.t(lv.nameKey) }));
  }

  function mount(root, onExit) {
    renderSetup();

    function renderSetup() {
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-sm font-semibold text-slate-400 mb-2' }, I18N.t('common.chooseLevel')));
      root.appendChild(Utils.el('div', { class: 'grid grid-cols-1 gap-2' }, LEVELS.map((lv, i) => {
        const best = Utils.getBest(`schulte_${i}`);
        return Utils.el('button', {
          class: 'p-4 rounded-md border border-slate-700 bg-slate-800/50 text-left hover:border-indigo-400 transition',
          onclick: () => startGame(i),
        }, [
          Utils.el('div', { class: 'font-semibold text-slate-100' }, `${I18N.t(lv.nameKey)} — ${lv.size}×${lv.size}`),
          Utils.el('div', { class: 'text-xs text-slate-500' }, I18N.t(lv.descKey) + (best ? I18N.t('schulte.recordSuffix', { t: Utils.fmtTime(Number(best)) }) : '')),
        ]);
      })));
    }

    function startGame(levelIdx) {
      const level = LEVELS[levelIdx];
      const total = level.size * level.size;
      const state = {
        levelIdx, level, total,
        layout: Utils.shuffle(Array.from({ length: total }, (_, i) => i + 1)),
        found: new Set(),
        next: 1, mistakes: 0, hints: 2, hintsUsed: 0,
        target: null, startedAt: Date.now(), timerId: null,
      };
      if (level.mode === 'reshuffle-random') state.target = state.layout[Utils.randInt(0, total - 1)];

      root.innerHTML = '';
      root.appendChild(hud(state));

      const gridWrap = Utils.el('div', { class: 'relative aspect-square' });
      root.appendChild(gridWrap);
      renderGrid(state, gridWrap);

      state.timerId = setInterval(() => {
        const t = root.querySelector('#schulte-time');
        if (t) t.textContent = Utils.fmtTime(Date.now() - state.startedAt);
      }, 50);

      function useHint() {
        if (state.hints <= 0) return;
        state.hints--;
        state.hintsUsed++;
        const expected = level.mode === 'reshuffle-random' ? state.target : state.next;
        const idx = state.layout.indexOf(expected);
        const cell = gridWrap.querySelector(`[data-idx="${idx}"]`);
        if (cell) {
          cell.classList.add('ring-2', 'ring-amber-400');
          setTimeout(() => cell.classList.remove('ring-2', 'ring-amber-400'), 800);
        }
        updateHud(state);
      }

      function onCellClick(idx) {
        const number = state.layout[idx];
        if (state.found.has(number)) return;
        const expected = level.mode === 'reshuffle-random' ? state.target : state.next;
        const cell = gridWrap.querySelector(`[data-idx="${idx}"]`);
        if (number === expected) {
          state.found.add(number);
          state.next++;
          if (state.found.size === state.total) { finishGame(state); return; }
          if (level.mode === 'reshuffle-random') {
            const remaining = state.layout.filter(n => !state.found.has(n));
            state.target = remaining[Utils.randInt(0, remaining.length - 1)];
          }
          // перемешиваем всю сетку целиком — найденные клетки остаются видимыми,
          // но не закрепляются на месте, чтобы взгляду не становилось легче с каждым разом
          if (level.mode !== 'static') state.layout = Utils.shuffle(state.layout);
          renderGrid(state, gridWrap);
        } else {
          state.mistakes++;
          if (cell) { cell.classList.add('shake', 'bg-rose-500/10'); setTimeout(() => cell.classList.remove('shake', 'bg-rose-500/10'), 400); }
        }
        updateHud(state);
      }

      function renderGrid(state, wrap) {
        wrap.innerHTML = '';
        const grid = Utils.el('div', {
          class: 'grid gap-1.5 w-full h-full',
          style: `grid-template-columns:repeat(${level.size},1fr);`,
        });
        state.layout.forEach((num, idx) => {
          const done = state.found.has(num);
          const cell = Utils.el('button', {
            'data-idx': idx,
            class: `aspect-square flex items-center justify-center rounded-md border font-bold text-base sm:text-lg transition ${done ? 'border-slate-800 bg-slate-800/40 text-slate-600 cursor-default' : 'border-slate-700 bg-slate-800 hover:border-indigo-400 active:scale-95 text-slate-100'}`,
            onclick: () => onCellClick(idx),
          }, String(num));
          grid.appendChild(cell);
        });
        wrap.appendChild(grid);

        if (level.mode === 'reshuffle-random') {
          wrap.appendChild(Utils.el('div', {
            class: 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none w-11 h-11 rounded-md bg-slate-100 text-slate-900 flex items-center justify-center font-extrabold text-lg shadow-lg',
          }, String(state.target)));
        } else {
          wrap.appendChild(Utils.el('div', {
            class: 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none w-3.5 h-3.5 rounded-full bg-rose-500 pulse-dot',
          }));
        }
      }

      function hud(state) {
        const wrap = Utils.el('div', { class: 'flex items-center justify-between mb-3' }, [
          Utils.el('div', { id: 'schulte-time', class: 'text-sm font-mono font-bold text-slate-200' }, '0.00с'),
          Utils.el('div', { id: 'schulte-mistakes', class: 'text-xs text-rose-400' }, ''),
          Utils.el('button', {
            class: 'flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-md bg-amber-500/15 text-amber-400',
            onclick: () => useHint(),
          }, [Utils.el('i', { 'data-lucide': 'lightbulb', class: 'w-4 h-4' }), Utils.el('span', { id: 'schulte-hints' }, ` ${state.hints}`)]),
        ]);
        setTimeout(() => updateHud(state), 0);
        return wrap;
      }

      function updateHud(state) {
        const m = root.querySelector('#schulte-mistakes');
        if (m) m.textContent = I18N.t('schulte.mistakes', { n: state.mistakes });
        const h = root.querySelector('#schulte-hints');
        if (h) h.textContent = ` ${state.hints}`;
        Utils.refreshIcons();
      }
    }

    function finishGame(state) {
      clearInterval(state.timerId);
      const elapsed = Date.now() - state.startedAt;
      const adjusted = elapsed + state.mistakes * 2000 + state.hintsUsed * 3000;
      const key = `schulte_${state.levelIdx}`;
      const isBest = Utils.setBest(key, adjusted, false);
      Utils.recordResult(key, adjusted);
      root.innerHTML = '';
      root.appendChild(Utils.el('div', { class: 'text-center py-10' }, [
        Utils.el('i', { 'data-lucide': 'target', class: 'w-10 h-10 mx-auto text-emerald-400 mb-3' }),
        Utils.el('div', { class: 'text-xl font-extrabold text-slate-100' }, I18N.t('schulte.won')),
        Utils.el('div', { class: 'text-slate-400 mt-1' }, I18N.t('schulte.wonInfo', { t: Utils.fmtTime(elapsed), n: state.mistakes }) + (isBest ? I18N.t('common.newRecord') : '')),
        Utils.el('div', { class: 'flex gap-2 justify-center mt-6' }, [
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-indigo-500 text-white font-semibold hover:bg-indigo-400', onclick: () => startGame(state.levelIdx) }, I18N.t('common.playAgain')),
          Utils.el('button', { class: 'px-4 py-2 rounded-md bg-slate-800 text-slate-200 font-semibold hover:bg-slate-700', onclick: onExit }, I18N.t('common.toMenu')),
        ]),
      ]));
      Utils.refreshIcons();
    }
  }

  return { id: 'schulte', titleKey: 'game.schulte.title', descKey: 'game.schulte.desc', icon: 'grid-3x3', color: 'bg-amber-500', historyVariants, mount };
})();
</script>
